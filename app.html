function runJob(id){
  const j = JOBS.find(x => x.id === id);
  const set = otomasiOf(id);
  if(set && !set.aktif){ toast('Otomasi ini sedang dimatikan Director, jadi tidak dijalankan.'); return; }
  let hasil = '';
  if(id === 'j1'){
    const per = nextP(S.periodeKepatuhan);
    S.kewajiban.filter(w => w.aktif).forEach(w => {
      if(S.periode.some(p => p.periode === per && p.kw === w.id)) return;
      const c = hitungJT(w, per);
      S.periode.push({id:'pk-' + per + '-' + w.id, periode:per, kw:w.id, jtRaw:c.raw, jt:c.jt, verif:0, oleh:'', tglVerif:'', kunci:0});
      S.project.filter(p => p.jenis === 'Pajak').forEach(p => S.patuh.push({id:uid('pt'), project:p.id, periode:per, kw:w.id, jt:c.jt,
        billing:0, billingTgl:'', billingBukti:'', bayar:0, bayarTgl:'', bayarBukti:'', nominal:0, lapor:0, laporTgl:'', laporBukti:'', catatan:''}));
    });
    S.tugas.unshift({id:uid('t'), judul:'Verifikasi tanggal jatuh tempo ' + fmtP(per), klien:'', project:'', siklus:'Bulanan', pic:'u5', tenggat:per + '-02', status:'Belum Mulai'});
    hasil = 'Periode kepatuhan ' + fmtP(per) + ' dibuat untuk delapan jenis kewajiban. Tugas verifikasi dikirim ke Dilla dengan cadangan Rani.';
  }
  if(id === 'j3' || id === 'j5'){
    const siklus = id === 'j3' ? 'Bulanan' : 'Mingguan';
    let n = 0;
    S.klien.filter(k => k.status === 'Aktif').forEach(k => {
      const p = S.project.find(x => x.klien === k.id && x.jenis === 'Akuntansi'); if(!p) return;
      S.dokreq.push({id:uid('dr'), klien:k.id, project:p.id, siklus, periode: siklus === 'Bulanan' ? prevP(TODAY.slice(0,7)) : TODAY,
        diminta:TODAY, diterima:'', status:'Diminta', pic:p.pic, jenis:['Mutasi bank','Aset tetap','Hutang','Piutang','Transaksi khusus'], drive:k.drive});
      n++;
    });
    hasil = n + ' permintaan dokumen ' + siklus.toLowerCase() + ' dibuat dan dikirim ke PIC klien.';
  }
  if(id === 'j6'){
    S.progres = S.progres || [];
    let n = 0;
    S.klien.filter(k => k.status === 'Aktif').forEach(k => {
      const p = S.project.find(x => x.klien === k.id && x.jenis === 'Akuntansi');
      const prod = p ? S.produksi.find(x => x.project === p.id && x.periode === S.periodeAktif) : null;
      S.progres.push({id:uid('pg'), klien:k.id, minggu:TODAY, status:'Draft',
        ringkas: prod ? 'Pekerjaan periode ' + fmtP(prod.periode) + ' berada pada tahap ' + TAHAP[prod.tahap-1] + '.' : 'Belum ada pekerjaan tercatat minggu ini.'});
      n++;
    });
    hasil = n + ' draft laporan progres disusun. Tidak ada yang terkirim, seluruhnya menunggu persetujuan manusia.';
  }
  if(id === 'j7'){ buatDraft(); hasil = 'Draft invoice dibuat dan pengingat dikirim ke Director.'; }
  if(id === 'j8'){
    const b = TODAY.slice(0,7);
    if(!S.sesiReview.some(s => s.bulan === b)) S.sesiReview.unshift({id:uid('sr'), bulan:b, tgl:addD(TODAY,12), peserta:S.tim.map(t => t.id), masukan:[]});
    hasil = 'Agenda sesi review kinerja ' + fmtP(b) + ' dibuat berisi daftar deliverable klien yang selesai bulan ini.';
  }
  if(id === 'j9'){
    const belum = S.klien.filter(k => !S.meeting.some(x => x.klien === k.id && x.jenis === 'Management Meeting Klien' && pOf(x.tgl) === TODAY.slice(0,7)));
    hasil = belum.length ? 'Peringatan dikirim ke Manager: ' + belum.map(k => k.nama).join(', ') + ' belum dijadwalkan.' : 'Seluruh klien sudah dijadwalkan.';
  }
  if(id === 'j10'){
    const per = TODAY.slice(0,7), bln = S.konten.filter(k => pOf(k.post) === per && k.status === 'Terbit');
    const s = bln.filter(k => k.jenis === 'Statis').length, v = bln.filter(k => k.jenis === 'Video').length;
    hasil = 'Peringatan ke PIC konten: statis ' + s + ' dari 8, video ' + v + ' dari 4.';
  }
  if(id === 'j14'){
    const kur = S.meeting.filter(m => m.jenis === 'Management Meeting Klien' && diff(TODAY, m.tgl) >= 0 && diff(TODAY, m.tgl) <= 3)
      .filter(m => { const s = siapMeeting(m); return s && !s.final; });
    hasil = kur.length ? 'Peringatan ke Elka dan Director: laporan ' + kur.map(m => klienOf(m.klien).nama).join(', ') + ' belum Final menjelang meeting.' : 'Seluruh laporan menjelang meeting sudah Final.';
  }
  if(id === 'j17'){
    const l = S.lead.filter(x => x.penawaranTgl && !x.followTgl);
    hasil = l.length ? 'Pengingat follow up dikirim ke pemilik prospek untuk ' + l.map(x => x.nama).join(', ') + '.' : 'Tidak ada penawaran yang menunggu follow up.';
  }
  if(id === 'j18'){
    const k = S.tim.filter(x => x.kontrakAkhir && diff(TODAY, x.kontrakAkhir) <= 60 && diff(TODAY, x.kontrakAkhir) >= 0);
    hasil = k.length ? 'Peringatan ke Director: kontrak ' + k.map(x => x.nama + ' berakhir ' + fmtD(x.kontrakAkhir)).join(', ') + '.' : 'Tidak ada kontrak yang berakhir dalam 60 hari.';
  }
  if(id === 'j19' || id === 'j20'){ UI.tab.ot = 'notif'; hasil = 'Antrean notifikasi disusun ulang, lihat tab Antrean notifikasi.'; }
  catatOtomasiJalan(id, hasil);
  S.otomasiLog.unshift({kapan:(set ? set.kapan : j.kapan) + ' · ' + j.modul, hasil, tgl:TODAY});
  log('Otomasi dijalankan manual: ' + j.aksi + ' Hasil: ' + hasil, j.modul);
  toast(hasil.slice(0,90)); save(); render();
}

/* ============================================================
   Modul C.3 — Laporan Manajemen
   Tiap keluaran berjalan sendiri melewati lima tahap:
   disusun, direview awal, umpan balik, review akhir, disetujui manajer.
   ============================================================ */
var OUT = [
  ['o1','Laporan Laba Rugi',1],
  ['o2','Laporan Posisi Keuangan (Neraca)',1],
  ['o3','Laporan Kas Flow',1],
  ['o4','Rekap kas masuk dan kas keluar per rekening dan per cabang',1],
  ['o5','Siapkan GL atau buku besar',1],
  ['o6','Laporan progress ke klien untuk monthly meeting',0],
  ['o7','MoM tiap meeting: kesimpulan, action plan, dan deadline',0]
];
var CEK_AWAL = ['Check all angka, makesure bener','Check all angka terumus','Check all angka make sense sesuai trennya'];
var CEK_AKHIR = ['Finalisasi angka, makesure rumus bener','Finalisasi angka: trend benar dan semua pertanyaan terjawab','Finalisasi presentasi yang rapi dan bagus'];
var PAJAK_STEP = [
  ['x1','Kalkulasi pajak terkait',0],
  ['x2','Terbitkan ID billing',0],
  ['x3','Faktur PPN, khusus klien PKP',2],
  ['x4','Cek ulang angka, menunggu persetujuan manajer',9],
  ['x5','Lapor PPN, khusus klien PKP',2],
  ['x6','Lapor PPh terkait',0]
];
var OTAHAP = ['Belum disusun','Draf disusun','Direview awal','Perlu perbaikan','Review akhir','Disetujui manajer'];
var OTAHAP_PILL = ['', 'run', 'run', 'late', 'run', 'ok'];

const lmOf = id => S.lm.find(x => x.id === id) || {};
const lmPer = () => UI.sel.lmPer || S.periodeAktif;
function outOf(lm, kode){
  lm.out = lm.out || {};
  if(!lm.out[kode]) lm.out[kode] = {tahap:0, prep:null, rev:null, cekAwal:[], fb:[], fin:null, cekAkhir:[], app:null};
  return lm.out[kode];
}
function batasOut(lm, kode){
  const o = outOf(lm, kode);
  return o.batas || lm.deliverBy || batasLaporanPeriode(lm.periode);
}
function asalBatas(lm, kode){
  const o = outOf(lm, kode);
  if(o.batas) return 'khusus keluaran ini';
  if(lm.custom) return 'ikut tenggat klien';
  return 'ikut tenggat periode';
}
function outDipakai(lm){
  const k = klienOf(lm.klien);
  return (k.layanan && k.layanan.acc) ? OUT : [];
}
function lmMaju(lm){
  const dipakai = outDipakai(lm).filter(o => o[2] === 1);
  if(!dipakai.length) return [0, 0];
  return [dipakai.filter(o => outOf(lm, o[0]).tahap === 5).length, dipakai.length];
}
function pajakDipakai(lm){
  const k = klienOf(lm.klien);
  if(!k.layanan || !k.layanan.tax) return [];
  return PAJAK_STEP.filter(s => !(s[2] === 2 && k.pkp !== 1));
}
function pajakHitung(lm){
  const d = pajakDipakai(lm);
  lm.pajak = lm.pajak || {};
  return [d.filter(s => lm.pajak[s[0]]).length, d.length];
}
function lmTahapUmum(lm){
  const k = klienOf(lm.klien);
  if(lm.kirim) return 'Terkirim ke klien';
  if(!k.layanan.acc) return 'Perpajakan saja';
  const [a, b] = lmMaju(lm);
  if(b && a >= b) return 'Siap dikirim';
  const jalan = outDipakai(lm).map(o => outOf(lm, o[0]).tahap);
  if(jalan.some(t => t === 3)) return 'Ada umpan balik';
  if(jalan.some(t => t === 4)) return 'Review akhir';
  if(jalan.some(t => t === 2)) return 'Direview awal';
  if(jalan.some(t => t === 1)) return 'Draf disusun';
  return 'Belum disusun';
}
function bolehTahap(lm, tahap){
  if(isDir()) return true;
  if(tahap === 1) return S.aktif === lm.preparer;
  if(tahap === 2 || tahap === 3) return S.aktif === lm.supAwal;
  if(tahap === 4 || tahap === 5) return S.aktif === lm.supAkhir;
  return false;
}
function judulOut(kode){ const o = OUT.find(x => x[0] === kode); return o ? o[1] : kode; }
function tahapBar(t){
  return '<span class="tbar">' + [1,2,3,4,5].map(i =>
    '<span class="tstep' + (t >= i ? ' on' : '') + (t === 3 && i === 3 ? ' warn' : '') + '"></span>').join('') + '</span>';
}

function pgLM(){

    '<button class="btn ghost" data-act="lmPer" data-v="-1">&larr;</button>' +
    '<span class="perlabel">' + fmtP(per) + '</span>' +

    (isMgr() ? '<button class="btn" data-act="lmBuat">Buat berkas periode ini</button>' : ''));

  const tabDef = [['papan','Papan berkas'],['keluaran','Per keluaran'],['peran','Beban per orang']];
  const t = T('lmTab', tabDef);
  let isi = '';
  if(t === 'papan'){

      rows.map(l => {

        const [a, b] = lmMaju(l), [pa, pb] = pajakHitung(l);
        return '<tr><td><b>' + esc(k.nama) + '</b>' + (k.alias ? '<div class="sub">' + esc(k.alias) + '</div>' : '') + '</td>' +
          '<td>' + (k.layanan.acc ? '<span class="tag">Acc</span>' : '') + (k.layanan.tax ? '<span class="tag">Tax</span>' : '') +
            (!k.layanan.acc && !k.layanan.tax ? '<span class="pill late">belum ditetapkan</span>' : '') + '</td>' +
          '<td>' + (b ? '<span class="pill ' + (a >= b ? 'ok' : a ? 'run' : '') + '">' + a + '/' + b + '</span>' : '<span class="muted">tidak ambil</span>') + '</td>' +
          '<td>' + (pb ? '<span class="pill ' + (pa >= pb ? 'ok' : pa ? 'run' : '') + '">' + pa + '/' + pb + '</span>' : '<span class="muted">tidak ambil</span>') + '</td>' +
          '<td>' + statusPill(l.kirim ? 'Final' : 'Sedang Dikerjakan') + ' <span class="mini">' + lmTahapUmum(l) + '</span></td>' +
          '<td>' + esc(nama(l.preparer)) + '</td>' +
          '<td>' + fmtD(l.deliverBy || batasPer) + (l.custom ? '<div class="mini">khusus klien ini</div>' : '') + '</td>' +
        '<td>' + (l.kirim ? '<span class="pill ok">' + fmtDS(l.kirim) + '</span>' : sisaPill(l.deliverBy || batasPer, 0)) + '</td>' +
          '<td><button class="btn sm" data-act="openLM" data-id="' + l.id + '">Buka</button></td></tr>';
      }), 'Belum ada berkas untuk periode ini'));
    if(perluIsi && isMgr()) isi += '<div class="note warn">' + perluIsi + ' klien belum punya penanda layanan dan penanggung jawab, sehingga belum muncul di papan mana pun.</div>';
  }
  if(t === 'keluaran') isi = papanKeluaran(rows);
  if(t === 'peran') isi = bebanPeran(rows);
  return head_ + kartuTarget(per, 'laporan') + kpis + tabs('lmTab', tabDef) + isi;
}

function papanKeluaran(rows){
  const kolom = [[1,'Draf disusun'],[2,'Direview awal'],[3,'Perlu perbaikan'],[4,'Review akhir'],[5,'Disetujui manajer']];
  const isi = kolom.map(function(kk){
    const tp = kk[0], lab = kk[1], kartuIsi = [];
    rows.forEach(l => outDipakai(l).forEach(o => {
      if(outOf(l, o[0]).tahap !== tp) return;
      kartuIsi.push('<div class="tile" data-act="openOut" data-id="' + l.id + '" data-k="' + o[0] + '">' +
        '<b>' + esc(o[1].length > 34 ? o[1].slice(0, 34) + '…' : o[1]) + '</b>' +
        '<div class="mini">' + esc(klienOf(l.klien).nama) + '</div>' +
        '<div class="mini">' + esc(nama(tp <= 1 ? l.preparer : tp <= 3 ? l.supAwal : l.supAkhir)) + '</div></div>');
    }));
    return '<div class="col"><div class="col-h"><span class="stepno">' + tp + '</span>' + lab +
      '<span class="cnt">' + kartuIsi.length + '</span></div>' +
      (kartuIsi.join('') || '<div class="hint">kosong</div>') + '</div>';
  }).join('');
  return '<div class="board">' + isi + '</div>';
}

function bebanPeran(rows){
  const map = {};
  rows.forEach(l => {
    [['preparer','Penyusun'],['taxPic','Pajak'],['supAwal','Review awal'],['supAkhir','Review akhir dan persetujuan']].forEach(function(x){
      const u = l[x[0]]; if(!u) return;
      map[u] = map[u] || {};
      map[u][x[1]] = (map[u][x[1]] || 0) + 1;
    });
  });
  const kol = ['Penyusun','Pajak','Review awal','Review akhir dan persetujuan'];
  const rowsB = Object.keys(map).map(u => '<tr><td><b>' + nama(u) + '</b><div class="sub">' +
    esc((S.tim.find(t => t.id === u) || {}).jabatan || '') + '</div></td>' +
    kol.map(c => '<td>' + (map[u][c] || '<span class="muted">—</span>') + '</td>').join('') +
    '<td><b>' + kol.reduce((s, c) => s + (map[u][c] || 0), 0) + '</b></td></tr>');
  const bentrok = rows.filter(l => l.preparer && l.preparer === l.supAwal);
  const catatan = bentrok.length
    ? '<div class="note warn">Pada ' + bentrok.length + ' berkas, penyusun dan pemeriksa awal adalah orang yang sama, sehingga tahap review awal kehilangan fungsinya.</div>' : '';
  return card('Beban per orang, periode ' + fmtP(lmPer()),
    table([['Orang']].concat(kol.map(c => [c])).concat([['Total']]), rowsB, 'Belum ada penugasan')) + catatan;
}

/* ---------- panel berkas ---------- */
function openLM(id){
  const lm = lmOf(id), k = klienOf(lm.klien);
  const maju = lmMaju(lm), a = maju[0], b = maju[1];
  const pj = pajakHitung(lm), pa = pj[0], pb = pj[1];
  const barisOut = outDipakai(lm).map(o => {
    const s = outOf(lm, o[0]);
    const jejak = [s.prep, s.rev, s.fin, s.app].filter(Boolean);
    return '<div class="outrow" data-act="openOut" data-id="' + id + '" data-k="' + o[0] + '">' +
      '<div class="outk"><b>' + esc(o[1]) + '</b>' + (o[2] === 0 ? ' <span class="mini">opsional</span>' : '') +
      '<div class="mini">' + (jejak.length ? jejak.map(x => esc(nama(x.by))).join(' &rarr; ') : 'belum ada jejak') +
      ((s.fb || []).length ? ' · ' + s.fb.length + ' umpan balik' : '') + '</div></div>' +
      '<div class="mini" style="text-align:right">' + fmtD(batasOut(lm, o[0])) +
      (s.tahap >= 5 ? '' : ' ' + sisaPill(batasOut(lm, o[0]), 0)) + '</div>' +
      '<div>' + tahapBar(s.tahap) + '</div>' +
      '<div><span class="pill ' + OTAHAP_PILL[s.tahap] + '">' + OTAHAP[s.tahap] + '</span></div></div>';
  }).join('') || '<div class="hint">Klien ini tidak mengambil jasa akuntansi.</div>';

  const barisPajak = pajakDipakai(lm).map(s => {
    const sudah = (lm.pajak || {})[s[0]];
    const perluApp = s[2] === 9;
    const boleh = perluApp ? (isDir() || S.aktif === lm.supAkhir) : (isDir() || S.aktif === lm.taxPic || S.aktif === lm.supAkhir);
    const terkunci = (s[0] === 'x5' || s[0] === 'x6') && !lm.pajak.x4;
    return '<label class="chk' + (terkunci ? ' dim' : '') + '"><input type="checkbox" data-act="pajakTik" data-id="' + id + '" data-k="' + s[0] + '"' + (terkunci ? ' disabled' : '') +
      (sudah ? ' checked' : '') + (boleh ? '' : ' disabled') + '>' +
      '<span>' + esc(s[1]) + (perluApp ? ' <span class="pill wait">persetujuan manajer</span>' : '') +
      (sudah ? '<div class="sub">' + esc(nama(sudah.by)) + ' · ' + fmtD(sudah.tgl) + '</div>' : '') + '</span></label>';
  }).join('');

  const kirim = '<div class="blok"><div class="blok-h"><div><b>Pengiriman ke klien</b><div class="sub">' +
    (b ? a + ' dari ' + b + ' keluaran wajib disetujui manajer' : 'tanpa keluaran akuntansi') + '</div></div>' +
    (lm.kirim ? '<span class="pill ok">terkirim ' + fmtDS(lm.kirim) + '</span>' : sisaPill(lm.deliverBy, 0)) + '</div>' +
    '<div class="grid2">' +
    '<label class="fl">Deliverable<input id="lmDel" value="' + esc(lm.deliverable) + '"></label>' +
    '<label class="fl">Dikirim ke<input id="lmTo" value="' + esc(lm.deliverTo) + '" placeholder="email klien"></label>' +
    '<label class="fl">Batas laporan klien ini<input id="lmBy" type="date" value="' + (lm.deliverBy || batasLaporanPeriode(lm.periode)) + '"></label>' +
    '<label class="fl">Batas perpajakan klien ini<input id="lmPj" type="date" value="' + (lm.batasPajak || batasPajakPeriode(lm.periode)) + '"></label>' +
    '<label class="fl">Tautan berkas<input id="lmLink" value="' + esc(lm.link) + '"></label></div>' +
    '<label class="chk"><input type="checkbox" id="lmIkut"' + (lm.custom ? '' : ' checked') + '>' +
    '<span>Ikut tenggat periode yang ditetapkan Manager' +
    '<div class="sub">Tenggat periode ' + fmtP(lm.periode) + ': laporan ' + fmtD(batasLaporanPeriode(lm.periode)) +
    ', perpajakan ' + fmtD(batasPajakPeriode(lm.periode)) + '</div></span></label>' +
    '<div class="row-btn"><button class="btn ghost sm" data-act="lmSimpan" data-id="' + id + '">Simpan detail</button>' +
    (lm.kirim ? '' : '<button class="btn sm" data-act="lmKirim" data-id="' + id + '"' + ((b && a >= b) ? '' : ' disabled') + '>Tandai terkirim</button>') +
    '</div>' + (b && a < b ? '<div class="note">Terkunci sampai seluruh keluaran wajib disetujui manajer.</div>' : '') + '</div>';

  const fb = (s.fb || []).map(f => '<div class="msg"><div class="msg-h"><b>' + esc(nama(f.by)) + '</b><span class="mini">' + fmtD(f.tgl) + '</span></div>' +
    '<div class="msg-b">' + esc(f.teks) + '</div></div>').join('') || '<div class="hint">Belum ada umpan balik.</div>';

  const aksi = [];

function simpanBatasOut(id){
  const lm = lmOf(id);

  outDipakai(lm).forEach(o => {
    const el = document.getElementById('bo-' + o[0]);
    if(!el) return;
    const s = outOf(lm, o[0]);
    const v = el.value || '';
    if((s.batas || '') !== v){ s.batas = v; n++; }
  });
  const khusus = outDipakai(lm).filter(o => outOf(lm, o[0]).batas).length;
  log('Tenggat keluaran ' + klienOf(lm.klien).nama + ' ' + fmtP(lm.periode) + ' diperbarui, ' +

}

function lmBuat(){
  const per = lmPer();
  let n = 0;
  S.klien.filter(k => k.lengkap && (k.layanan.acc || k.layanan.tax)).forEach(k => {
    if(S.lm.some(l => l.klien === k.id && l.periode === per)) return;
    S.lm.push({id:'lm-' + k.id + '-' + per, klien:k.id, periode:per, link:'',
      preparer:k.preparer, taxPic:k.taxPic, supAwal:k.supAwal, supAkhir:k.supAkhir,
      out:{}, pajak:{}, deliverable:(k.layanan.acc ? 'Laporan Manajemen ' : 'Rekap kewajiban pajak ') + fmtP(per),
      deliverTo:k.email || '', deliverBy: batasLaporanPeriode(per), kirim:'', umpan:''});
    n++;
  });
  if(!n){ toast('Semua klien sudah punya berkas untuk periode ini.'); return; }
  log(n + ' berkas Laporan Manajemen periode ' + fmtP(per) + ' dibuat', 'C.LM');
  save(); render(); toast(n + ' berkas dibuat.');
}
function lmMenunggu(u){
  return (S.lm || []).filter(l => l.periode === S.periodeAktif && !l.kirim).filter(l => {
    const adaOut = outDipakai(l).some(o => {
      const t = outOf(l, o[0]).tahap;
      if((t === 0 || t === 3) && l.preparer === u) return true;
      if(t === 1 && l.supAwal === u) return true;
      if((t === 2 || t === 4) && l.supAkhir === u) return true;
      return false;
    });
    const pj = pajakHitung(l);
    return adaOut || (pj[1] && l.taxPic === u && pj[0] < pj[1]);
  }).length;
}
/* ============================================================
   Data induk dan CRUD: klien, tim, dokumen, tugas
   ============================================================ */
function myKlienIds(){
  if(isMgr()) return S.klien.map(k => k.id);
  const ids = new Set();
  S.project.filter(p => p.pic === S.aktif || p.reviewer === S.aktif).forEach(p => ids.add(p.klien));
  S.klien.forEach(k => { if([k.preparer, k.taxPic, k.supAwal, k.supAkhir].includes(S.aktif)) ids.add(k.id); });
  return [...ids];
}
const opsTim = (v, kosong) => (kosong ? '<option value="">— belum ditugaskan —</option>' : '') +
  S.tim.filter(t => t.aktif).map(t => '<option value="' + t.id + '"' + (t.id === v ? ' selected' : '') + '>' + esc(t.nama) + ' — ' + esc(t.jabatan) + '</option>').join('');
const fl = (lab, id, val, tipe, ph) => '<label class="fl">' + lab + '<input id="' + id + '" type="' + (tipe || 'text') + '" value="' + esc(val == null ? '' : val) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '></label>';
const fsel = (lab, id, isi) => '<label class="fl">' + lab + '<select id="' + id + '">' + isi + '</select></label>';
const V = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const CEK = id => { const el = document.getElementById(id); return el && el.checked ? 1 : 0; };

/* ---------------- klien ---------------- */
function pgKlien(){
  const ids = myKlienIds();
  const kl = S.klien.filter(k => ids.includes(k.id));
  const sel = UI.sel.klien && kl.some(k => k.id === UI.sel.klien) ? UI.sel.klien : (kl[0] || {}).id;
  const k = klienOf(sel);
  const belum = kl.filter(x => !x.lengkap).length;
  const tanpaPkp = kl.filter(x => x.layanan.tax && x.pkp === null).length;

  let h = head('Modul C.1', 'Klien & Project',
    'Data induk klien, penanda layanan, dan penanggung jawab tiap peran',
    isMgr() ? '<button class="btn" data-act="formKlien">Tambah klien</button>' : '');

  const peringatan = [];
  if(belum) peringatan.push(belum + ' klien belum punya penanda layanan dan penanggung jawab, sebagian besar berasal dari berkas pelacak Laporan Manajemen');
  if(tanpaPkp) peringatan.push(tanpaPkp + ' klien berjasa pajak belum diisi status PKP, sehingga langkah faktur pajak dan lapor PPN belum bisa diwajibkan');
  const konflik = kl.filter(x => x.preparer && x.preparer === x.supAwal);
  if(konflik.length) peringatan.push(konflik.length + ' klien memakai orang yang sama sebagai penyusun sekaligus supervise awal');
  if(peringatan.length && isMgr()) h += '<div class="note warn">' + peringatan.map(p => '<div>' + p + '</div>').join('') + '</div>';

  h += '<div class="split"><div>';
  const q = (UI.q.klien || '').toLowerCase(), f = UI.sel.filKlien || 'semua';
  const rows = kl.filter(x => {
    if(q && !(x.nama + ' ' + x.alias).toLowerCase().includes(q)) return false;
    if(f === 'Acc') return x.layanan.acc && !x.layanan.tax;
    if(f === 'Tax') return x.layanan.tax && !x.layanan.acc;
    if(f === 'Acc dan Tax') return x.layanan.acc && x.layanan.tax;
    if(f === 'Perlu dilengkapi') return !x.lengkap;
    return true;
  });
  h += table([['Klien'],['Layanan'],['Penyusun'],['Sup. awal'],['Status'],['','width:1%']],
    rows.map(x => '<tr' + (x.id === sel ? ' style="background:var(--em50)"' : '') + '>' +

      '<td>' + (x.layanan.acc ? '<span class="tag">Acc</span>' : '') + (x.layanan.tax ? '<span class="tag">Tax</span>' : '') +
        (!x.layanan.acc && !x.layanan.tax ? '<span class="muted">belum ada</span>' : '') + '</td>' +
      '<td>' + (x.preparer ? esc(nama(x.preparer)) : '<span class="muted">—</span>') + '</td>' +
      '<td>' + (x.supAwal ? esc(nama(x.supAwal)) : '<span class="muted">—</span>') + '</td>' +
      '<td>' + (x.status === 'Perlu dilengkapi' ? '<span class="pill late">perlu dilengkapi</span>' : statusPill(x.status)) + '</td>' +
      '<td class="num"><button class="btn sm ghost" data-act="selKlien" data-id="' + x.id + '">Lihat</button></td></tr>'),
    'Tidak ada klien yang cocok');
  /* ringkasan portofolio, mengisi kolom kiri di bawah tabel */
  const jum = f => kl.filter(f).length;
  const bebanPenyusun = {};
  kl.forEach(x => { if(x.preparer) bebanPenyusun[x.preparer] = (bebanPenyusun[x.preparer] || 0) + 1; });
  const urutBeban = Object.entries(bebanPenyusun).sort((a,b) => b[1] - a[1]);
  const perluAksi = kl.filter(x => !x.lengkap || (x.layanan.tax && x.pkp === null) || (x.preparer && x.preparer === x.supAwal));
  const alasan = x => {
    const l = [];
    if(!x.lengkap) l.push('layanan dan penanggung jawab kosong');
    if(x.layanan.tax && x.pkp === null) l.push('status PKP belum diisi');
    if(x.preparer && x.preparer === x.supAwal) l.push('penyusun sama dengan supervise awal');
    return l.join(', ');
  };
  h += '<div style="height:14px"></div>' + card('Ringkasan portofolio',
    '<div class="grid g4" style="margin-bottom:12px">' +
      kpi('Klien aktif', jum(x => x.status === 'Aktif'), 'dari ' + kl.length + ' terdaftar') +
      kpi('Akuntansi', jum(x => x.layanan.acc), jum(x => x.layanan.acc && x.layanan.tax) + ' sekaligus pajak') +
      kpi('Perpajakan', jum(x => x.layanan.tax), jum(x => x.pkp === 1) + ' berstatus PKP') +
      kpi('Perlu dilengkapi', jum(x => !x.lengkap), jum(x => !x.lengkap) ? 'belum bisa masuk papan kerja' : 'seluruhnya lengkap', jum(x => !x.lengkap) > 0) +
    '</div>' +
    (urutBeban.length ? '<div class="rowline"><div><b>Beban penyusun laporan</b></div><div class="g"></div></div>' +
      urutBeban.map(([u,n]) => '<div class="rowline"><div>' + esc(nama(u)) + '</div><div class="g">' +
        '<div class="bar" style="width:120px;display:inline-block;vertical-align:middle;margin-right:8px"><i style="width:' +
        Math.round(n / urutBeban[0][1] * 100) + '%"></i></div>' + n + ' klien</div></div>').join('') : ''));

  if(perluAksi.length) h += '<div style="height:14px"></div>' + card('Klien yang perlu dirapikan',
    table([['Klien'],['Yang perlu diisi'],['','width:1%']],
      perluAksi.map(x => '<tr><td><b>' + esc(x.nama) + '</b></td><td class="mini">' + esc(alasan(x)) + '</td>' +
        '<td class="num"><button class="btn sm ghost" data-act="formKlien" data-id="' + x.id + '">Lengkapi</button></td></tr>'),
      'Tidak ada', 'klien-perlu'));

  h += '</div><div class="stack">';

  if(k.id){
    const aksi = isMgr()
      ? '<div class="row-btn"><button class="btn sm ghost" data-act="formKlien" data-id="' + k.id + '">Ubah</button>' +
        '<button class="btn sm danger" data-act="hapusKlien" data-id="' + k.id + '">Hapus</button></div>'
      : '';
    h += card(esc(k.nama),
      '<div class="mini">' + esc(k.bentuk) + (k.mulai ? ' · sejak ' + fmtD(k.mulai) : '') + '</div>' +
      '<div class="rowline"><div>Layanan</div><div class="g">' +
        (k.layanan.acc ? '<span class="tag">Akuntansi</span>' : '') + (k.layanan.tax ? '<span class="tag">Pajak</span>' : '') +
        (!k.layanan.acc && !k.layanan.tax ? '<span class="pill late">belum ditetapkan</span>' : '') + '</div></div>' +
      '<div class="rowline"><div>Status PKP</div><div class="g">' + (k.pkp === 1 ? 'PKP' : k.pkp === 0 ? 'Non PKP' : '<span class="pill late">belum diisi</span>') + '</div></div>' +
      '<div class="rowline"><div>NPWP</div><div class="g mono">' + (k.npwp ? (isMgr() ? esc(k.npwp) : '••.•••.•••.•-•••.' + k.npwp.slice(-3)) : '—') + '</div></div>' +
      '<div class="rowline"><div>PIC klien</div><div class="g">' + (esc(k.pic) || '—') + '</div></div>' +
      '<div class="rowline"><div>Kontak</div><div class="g mono">' + (esc(k.kontak) || '—') + '</div></div>' +
      '<div class="rowline"><div>Email laporan</div><div class="g mono">' + (esc(k.email) || '—') + '</div></div>' +
      '<div class="rowline"><div>Folder Drive</div><div class="g">' + (k.drive ? '<a href="' + esc(k.drive) + '" target="_blank" rel="noopener">buka</a>' : '—') + '</div></div>' + aksi);

    h += card('Pembagian kerja',
      [['Penyusun laporan','preparer'],['Perpajakan','taxPic'],['Supervise awal, review awal','supAwal'],['Supervise akhir dan persetujuan manajer','supAkhir']]
        .map(([lab,f]) => '<div class="rowline"><div>' + lab + '</div><div class="g">' + (k[f] ? esc(nama(k[f])) : '<span class="muted">belum ditugaskan</span>') + '</div></div>').join('') +
      (k.preparer && k.preparer === k.supAwal ? '<div class="note warn">Penyusun dan supervise awal orang yang sama. Tahap supervise awal jadi tidak berfungsi sebagai kontrol.</div>' : ''));

    if(onbSelesai(k) < ONBOARD.length || k.tugasOnboard) h += kartuOnboarding(k);
    h += card('Lampiran klien', kotakLampiran('klien:' + k.id, {judul:false}),
      '<button class="btn sm ghost" data-act="formLampiran" data-r="klien:' + k.id + '">Tambah lampiran</button>');
    h += card('Project berjalan',
      S.project.filter(p => p.klien === k.id).map(p =>
        '<div class="rowline"><div><b>' + p.jenis + '</b><div class="mini">PIC ' + esc(nama(p.pic)) + ' · reviewer ' + esc(nama(p.reviewer)) + '</div></div>' +
        '<div class="g">' + nilaiTampil(p.nilai) + '</div></div>').join('') || '<div class="hint">Belum ada project. Project dibuat otomatis begitu penanda layanan diisi.</div>');

    h += card('Rekening bank',
      (S.rekening.filter(r => r.klien === k.id).map(r =>
        '<div class="rowline"><div><b>' + esc(r.bank) + '</b><div class="mini mono">' + rekTampil(r.no) + '</div></div>' +
        '<div class="g">' + (isMgr() ? '<button class="btn sm ghost" data-act="hapusRek" data-id="' + r.id + '">Hapus</button>' : '<span class="pill ok">aktif</span>') + '</div></div>').join('') ||
        '<div class="hint">Belum ada rekening.</div>') +
      (isMgr() ? '<div class="row-btn"><button class="btn sm ghost" data-act="formRek" data-id="' + k.id + '">Tambah rekening</button></div>'
               : '<div class="mini" style="margin-top:8px">Nomor rekening ditampilkan sebagian untuk peran Anda.</div>'));
  }
  h += '</div></div>';
  return h;
}

function simpanKlien(id){
  const n = V('kN');
  if(!n){ toast('Nama klien wajib diisi.'); return; }
  const acc = CEK('kAcc'), tax = CEK('kTax');
  const pkpRaw = V('kPk');
  const isi = {
    nama:n, alias:V('kA'), bentuk:V('kB'), npwp:V('kP'), group:V('kG') || '—', prioritas:V('kR'),
    pic:V('kI'), kontak:V('kK'), email:V('kE'), drive:V('kD'), mulai:V('kM') || TODAY,
    pkp: pkpRaw === '' ? null : +pkpRaw, layanan:{acc, tax},
    preparer:V('kPr'), taxPic:V('kTx'), supAwal:V('kSa'), supAkhir:V('kSb'),
    nilaiA:+V('kVa') || 0, nilaiT:+V('kVt') || 0
  };
  isi.lengkap = (acc || tax) && isi.preparer ? 1 : 0;
  isi.status = isi.lengkap ? 'Aktif' : 'Perlu dilengkapi';
  let k;
  if(id){ k = klienOf(id); Object.assign(k, isi); log('Data klien ' + n + ' diubah', 'C.1'); }
  else { k = Object.assign({id:uid('k')}, isi); S.klien.push(k); siapkanOnboarding(k);
    log('Klien ' + n + ' ditambahkan, tugas onboarding dibuat', 'C.1'); }
  if(!k.drive) k.drive = 'https://drive.google.com/drive/folders/' + k.id;
  sinkronProject(k);
  UI.sel.klien = k.id;
  save(); closeModal(); render(); toast(id ? 'Perubahan tersimpan.' : 'Klien dibuat.');
}
/* project mengikuti penanda layanan: dibuat bila dicentang, dihentikan bila dilepas */
function sinkronProject(k){
  [['acc','Akuntansi','preparer','supAwal','nilaiA'],['tax','Pajak','taxPic','supAkhir','nilaiT']].forEach(([f,jenis,picF,revF,nilaiF]) => {
    const ada = S.project.find(p => p.klien === k.id && p.jenis === jenis);
    if(k.layanan[f]){
      if(ada){ ada.pic = k[picF] || ada.pic; ada.reviewer = k[revF] || ada.reviewer; ada.nilai = k[nilaiF] || 0; ada.status = 'Aktif'; }
      else S.project.push({id:uid('p'), klien:k.id, jenis, pic:k[picF] || '', reviewer:k[revF] || '', mulai:k.mulai || TODAY, status:'Aktif', nilai:k[nilaiF] || 0});
    } else if(ada) ada.status = 'Berhenti';
  });
}
function hapusKlien(id){
  const k = klienOf(id);
  const jejak = S.lm.filter(l => l.klien === id).length + S.produksi.filter(p => projOf(p.project).klien === id).length;
  modal('Hapus klien',

    '<label class="fl">Alasan<textarea id="hapusAlasan" rows="2"></textarea></label>',
    '<button class="btn ghost" data-act="close">Batal</button>' +

}
function hapusKlienOk(id){
  const k = klienOf(id);
  if(V('hapusKonfirm') !== k.nama){ toast('Nama yang diketik belum cocok.'); return; }
  const alasan = V('hapusAlasan');
  if(!alasan){ toast('Alasan wajib diisi.'); return; }
  const pids = S.project.filter(p => p.klien === id).map(p => p.id);
  S.project = S.project.filter(p => p.klien !== id);
  S.klien = S.klien.filter(x => x.id !== id);
  S.rekening = S.rekening.filter(r => r.klien !== id);
  S.lm = S.lm.filter(l => l.klien !== id);
  S.dok = S.dok.filter(d => d.klien !== id);
  S.tugas = S.tugas.filter(t => t.klien !== id);
  S.produksi = S.produksi.filter(p => !pids.includes(p.project));
  S.patuh = S.patuh.filter(p => !pids.includes(p.project));
  S.invoice = S.invoice.filter(i => i.klien !== id);
  S.meeting = S.meeting.filter(m => m.klien !== id);
  UI.sel.klien = null;
  log('Klien ' + k.nama + ' dihapus beserta seluruh datanya. Alasan: ' + alasan, 'C.1');
  save(); closeModal(); render(); toast('Klien dihapus.');
}

    fl('Tenggat','tT',t.tenggat,'date') +

}
function simpanTugas(id){
  const j = V('tJ');
  if(!j){ toast('Judul tugas wajib diisi.'); return; }
  const kid = V('tK'), pihak = V('tPh');
  if(pihak === 'klien' && !kid){ toast('Tugas untuk klien harus dikaitkan ke satu klien.'); return; }
  const pr = S.project.find(p => p.klien === kid && p.status === 'Aktif');
  const isi = {judul:j, klien:kid, project: pr ? pr.id : '', pic:V('tP'), pihak, siklus:V('tS'),
    tenggat:V('tT'), status:V('tSt'), catatan:V('tC')};
  if(id){ Object.assign(S.tugas.find(x => x.id === id), isi); log('Tugas "' + j + '" diubah', 'A.2'); }
  else {
    const baru = Object.assign({id:uid('t')}, isi);
    S.tugas.push(baru);
    pindahDraf('tugas:' + baru.id);
    if(pihak === 'klien') buatNotif([isi.pic], 'Tugas baru untuk klien', j + ' · ' + klienOf(kid).nama, 'tugas', '');
    else buatNotif([isi.pic], 'Tugas baru untuk Anda', j + (kid ? ' · ' + klienOf(kid).nama : ''), 'tugas', '');
    log('Tugas "' + j + '" dibuat untuk ' + (pihak === 'klien' ? 'klien ' + klienOf(kid).nama : nama(isi.pic)), 'A.2');
  }
  save(); closeModal(); render(); toast('Tugas tersimpan.');
}
function hapusTugas(id){
  const t = S.tugas.find(x => x.id === id);
  S.tugas = S.tugas.filter(x => x.id !== id);
  log('Tugas "' + t.judul + '" dihapus', 'A');
  save(); closeModal(); render(); toast('Tugas dihapus.');
}

function simpanTim(id){

function hapusTim(id){
  const t = S.tim.find(x => x.id === id);
  const beban = S.klien.filter(k => [k.preparer,k.taxPic,k.supAwal,k.supAkhir].includes(id)).length +
                S.project.filter(p => p.pic === id || p.reviewer === id).length;
  if(id === S.aktif){ toast('Tidak bisa menghapus akun yang sedang dipakai.'); return; }
  if(beban){ toast(t.nama + ' masih tercatat pada ' + beban + ' penugasan. Pindahkan dulu penugasannya.'); return; }
  S.tim = S.tim.filter(x => x.id !== id);
  log('Anggota tim ' + t.nama + ' dihapus', 'G');
  save(); closeModal(); render(); toast('Anggota tim dihapus.');

/* ============================================================
   Portal klien: data keuangan hanya bisa dilihat, tetapi klien
   boleh menutup tugasnya sendiri, mengirim pesan, mengajukan
   jadwal rapat, dan membaca notulen yang dibagikan.
   ============================================================ */
function klienIni(){ return klienOf(S.aktif); }
function pkTugas(){ return S.tugas.filter(t => t.klien === S.aktif && t.pihak === 'klien'); }
function pkPesan(){ return S.pesan.filter(p => p.klien === S.aktif && p.klienAkses); }
function pkMeeting(){ return S.meeting.filter(m => m.klien === S.aktif); }
function pkNotulen(){
  const ids = pkMeeting().map(m => m.id);
  return S.notulen.filter(n => ids.includes(n.meeting) && n.bagi);
}
function pkTim(){
  const k = klienIni();
  return [...new Set([k.preparer, k.taxPic, k.supAwal, k.supAkhir].filter(Boolean))];
}
function peranKlienLabel(u, k){
  const l = [];
  if(k.preparer === u) l.push('penyusun laporan');
  if(k.taxPic === u) l.push('perpajakan');
  if(k.supAwal === u) l.push('pemeriksa awal');
  if(k.supAkhir === u) l.push('pemeriksa akhir');
  return l.join(', ') || 'tim Sage';
}
function pgPortal(){
  const k = klienIni();
  if(!k.id) return '<div class="empty"><b>Akun klien tidak dikenali</b>Keluar lalu masuk lagi dengan surel klien.</div>';
  const tgBuka = pkTugas().filter(t => t.status !== 'Selesai');
  const psBaru = pkPesan().filter(p => psBelum(p, S.aktif)).length;
  const t = UI.tab.pk || 'ringkas';
  const judul = {ringkas:'Ringkasan', tugas:'Tugas saya', pesan:'Pesan', rapat:'Rapat', notulen:'Notulen', berkas:'Laporan & tagihan'};
  const sub = {
    ringkas:'Ruang kerja bersama tim Sage: tugas, pesan, jadwal rapat, notulen, dan laporan',
    tugas:'Pekerjaan yang diminta tim Sage dari Anda beserta tenggatnya',
    pesan:'Percakapan berulir dengan tim Sage yang menangani Anda',
    rapat:'Jadwal rapat dan pengajuan jadwal baru',
    notulen:'Catatan rapat yang dibagikan tim Sage beserta tindak lanjutnya',
    berkas:'Laporan bulanan, dokumen yang ditunggu, dan tagihan'
  };
  let h = head(esc(k.nama), judul[t], sub[t]);
  if(t === 'ringkas') h += pkRingkas(k);
  if(t === 'tugas') h += pkPanelTugas();
  if(t === 'pesan') h += pkPanelPesan();
  if(t === 'rapat') h += pkPanelRapat();
  if(t === 'notulen') h += pkPanelNotulen();
  if(t === 'berkas') h += pkPanelBerkas(k);
  return h;
}

function pkRingkas(k){
  const lms = S.lm.filter(l => l.klien === k.id).sort((a,b) => b.periode.localeCompare(a.periode));
  const lmNow = lms.find(l => l.periode === S.periodeAktif) || lms[0];
  const tgBuka = pkTugas().filter(x => x.status !== 'Selesai');
  const telat = tgBuka.filter(x => diff(x.tenggat, TODAY) > 0);
  const mtg = pkMeeting().filter(m => m.status === 'Terjadwal' && diff(TODAY, m.tgl) >= 0).sort((a,b) => a.tgl.localeCompare(b.tgl));
  const belum = S.invoice.filter(i => i.klien === k.id && i.status !== 'Lunas');
  const stat = l => !l ? 'Belum dimulai' : l.kirim ? 'Sudah dikirim' : lmTahapUmum(l);

  let h = '';
  h += '<div class="grid g4" style="margin-bottom:14px">' +
    kpi('Laporan ' + fmtP(lmNow ? lmNow.periode : S.periodeAktif), stat(lmNow),
      lmNow && lmNow.kirim ? 'dikirim ' + fmtD(lmNow.kirim) : (lmNow ? 'target kirim ' + fmtD(lmNow.deliverBy) : '—')) +
    kpi('Tugas menunggu Anda', tgBuka.length, telat.length ? telat.length + ' sudah lewat tenggat' : 'tidak ada yang terlambat', telat.length > 0) +
    kpi('Rapat berikutnya', mtg.length ? fmtDS(mtg[0].tgl) : '—', mtg.length ? mtg[0].jam + ' · ' + mtg[0].mode : 'belum dijadwalkan') +
    kpi('Tagihan belum lunas', belum.length, belum.length ? 'jatuh tempo ' + fmtDS(belum[belum.length-1].jt) : 'seluruhnya lunas', belum.length > 0) + '</div>';

  h += '<div class="grid g2">' +
    card('Yang perlu Anda kerjakan',
      (tgBuka.length ? tgBuka.sort((a,b) => a.tenggat.localeCompare(b.tenggat)).slice(0,5).map(x =>
        '<div class="rowline"><div><b>' + esc(x.judul) + '</b><div class="mini">tenggat ' + fmtD(x.tenggat) + '</div></div>' +
        '<div class="g">' + sisaPill(x.tenggat, 0) + '</div></div>').join('')
        : '<div class="hint">Tidak ada tugas terbuka. Terima kasih.</div>'),
      '<button class="btn sm ghost" data-act="pkTab" data-v="tugas">Lihat semua</button>') +
    card('Tim Sage yang menangani Anda',
      (pkTim().map(u => '<div class="rowline"><div><b>' + esc(nama(u)) + '</b><div class="mini">' + esc(peranKlienLabel(u, k)) + '</div></div>' +
        '<div class="g"><span class="pill">tim Sage</span></div></div>').join('') || '<div class="hint">Penanggung jawab belum ditetapkan.</div>'),
      '<button class="btn sm" data-act="formPesanKlien">Kirim pesan</button>') +
    '</div>';
  return h;
}

const RXMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

function psPeserta(p){ return [...new Set([p.dari, ...(p.ke || []), ...(p.cc || [])])]; }
function psBelum(p, u){ return (p.pesan || []).some(m => m.oleh !== u && !(m.baca || []).includes(u)); }

function pesanSaya(){
  const u = S.aktif;
  return S.pesan.filter(p => psPeserta(p).includes(u) || (p.pesan || []).some(m => m.oleh === u));
}
function pgPesan(){
  const u = S.aktif;

  if(q) list = list.filter(p => (p.subjek + ' ' + (p.pesan || []).map(m => m.teks).join(' ')).toLowerCase().includes(q));
  list = list.sort((a,b) => (b.pesan[b.pesan.length-1].tgl).localeCompare(a.pesan[a.pesan.length-1].tgl));

  const sel = UI.sel.pesan && list.some(p => p.id === UI.sel.pesan) ? UI.sel.pesan : (list[0] || {}).id;
  const belum = pesanSaya().filter(p => psBelum(p, u)).length;

function jamKini(){ const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function buatNotif(untuk, judul, teks, page, ref){
  const daftar = [...new Set((untuk || []).filter(u => u && u !== S.aktif))];
  if(!daftar.length) return;
  S.notif = S.notif || [];
  S.notif.unshift({id:uid('nt'), untuk:daftar, judul, teks, page, ref, tgl:TODAY, jam:jamKini(), baca:[]});
}
function notifSaya(){ return (S.notif || []).filter(n => n.untuk.includes(S.aktif)); }
function notifBelum(){ return notifSaya().filter(n => !n.baca.includes(S.aktif)).length; }
function bacaNotifRef(page, ref){
  (S.notif || []).forEach(n => { if(n.page === page && n.ref === ref && n.untuk.includes(S.aktif) && !n.baca.includes(S.aktif)) n.baca.push(S.aktif); });
}
function drawNotif(){
  const el = document.getElementById('notifList');
  if(!el) return;
  const list = notifSaya().slice(0,30);
  el.innerHTML = list.length ? list.map(n => '<div class="nrow' + (n.baca.includes(S.aktif) ? '' : ' unread') + '" data-act="bukaNotif" data-id="' + n.id + '">' +
    '<div class="nr-h"><b>' + esc(n.judul) + '</b><span class="mini">' + fmtDS(n.tgl) + ' ' + esc(n.jam || '') + '</span></div>' +
    '<div class="mini clip">' + esc(n.teks) + '</div></div>').join('')
    : '<div class="empty"><b>Tidak ada notifikasi</b>Pemberitahuan akan muncul di sini.</div>';
  const b = document.getElementById('bellCount');
  const n = notifBelum();
  b.textContent = n > 9 ? '9+' : n;
  b.style.display = n ? 'grid' : 'none';
}
function bukaNotif(id){
  const n = (S.notif || []).find(x => x.id === id);
  if(!n) return;
  if(!n.baca.includes(S.aktif)) n.baca.push(S.aktif);
  tutupPop();
  if(n.page === 'pesan' && n.ref) UI.sel.pesan = n.ref;
  if(n.page && boleh(n.page)) go(n.page); else render();
  save();
}
function bacaSemuaNotif(){
  notifSaya().forEach(n => { if(!n.baca.includes(S.aktif)) n.baca.push(S.aktif); });
  save(); drawNotif(); drawNav();

function tutupPop(){ ['notifPop','profPop'].forEach(i => document.getElementById(i).classList.remove('on')); }
function togglePop(id){

}

    toast('Berkas ini tidak membawa data contoh. Isinya diambil dari Spreadsheet.');
    return;
  }
  modal('Muat data contoh',
    '<p>Seluruh data yang ada sekarang akan diganti dengan data contoh: 24 klien, tim lengkap, laporan berjalan, kepatuhan pajak, pesan, dan riwayat.</p>' +

    '<button class="btn ghost" data-act="close">Batal</button>' +

}
function dataContohOk(){
  if(V('dcKonfirm') !== 'CONTOH'){ toast('Ketik CONTOH untuk mengonfirmasi.'); return; }
  const aktif = S.aktif;

/* ============================================================
   Lampiran: berkas atau tautan, bisa ditempel di mana saja.
   Berkas diunggah ke folder Drive Sage lewat Apps Script.
   Di purwarupa tanpa peladen, berkas hanya dicatat, tidak terunggah.
   ============================================================ */
const BATAS_UNGGAH = 20 * 1024 * 1024;     // 20 MB
const FOLDER_DRIVE = 'https://drive.google.com/drive/folders/1yqty3d7VyUYzdGxpqmBe1AH-XJ8IgBaK';

function lampiranUntuk(ref){ return (S.lampiran || []).filter(l => l.ref === ref); }
function adaPeladen(){ return typeof window !== 'undefined' && window.SIMS && typeof window.SIMS.unggah === 'function'; }
function fmtUkuran(n){
  if(!n) return '';
  if(n < 1024) return n + ' B';
  if(n < 1048576) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function ikonBerkas(nama){
  const e = String(nama || '').split('.').pop().toLowerCase();
  if(['pdf'].includes(e)) return '▤';
  if(['xls','xlsx','csv'].includes(e)) return '▦';
  if(['doc','docx'].includes(e)) return '▥';
  if(['png','jpg','jpeg','gif','webp'].includes(e)) return '◪';
  return '◫';
}

/** Kotak lampiran yang bisa ditempel di halaman atau di dalam modal. */
function kotakLampiran(ref, opsi){
  opsi = opsi || {};

    (opsi.judul === false ? '' : '<div class="lamp-h"><b>Lampiran</b>' +
      (bisaUbah ? '<button class="btn sm ghost" data-act="formLampiran" data-r="' + esc(ref) + '">Tambah lampiran</button>' : '') + '</div>') +
    (list.length ? list.map(l => '<div class="lamp-row">' +
      '<span class="lamp-ic">' + (l.jenis === 'tautan' ? '⧉' : l.jenis === 'dokumen' ? '▦' : ikonBerkas(l.nama)) + '</span>' +
      '<div class="lamp-info"><b>' + esc(l.nama) + '</b>' +
      '<div class="mini">' + (l.jenis === 'tautan' ? 'tautan' : l.jenis === 'dokumen' ? 'dari daftar Dokumen' : fmtUkuran(l.ukuran)) +
        ' · ' + esc(nama(l.oleh)) + ' · ' + fmtD(l.tgl) +
        (l.status === 'menunggu' ? ' · <span class="pill wait">belum terunggah</span>' : '') + '</div></div>' +
      (l.url ? '<a class="btn sm ghost" href="' + esc(l.url) + '" target="_blank" rel="noopener">Buka</a>' : '') +
      (bisaUbah ? ' <button class="btn sm danger" data-act="hapusLampiran" data-id="' + l.id + '">Hapus</button>' : '') +
      '</div>').join('') : '<div class="hint">Belum ada lampiran.</div>') +
    '</div>';
}

/* Menyiapkan seret dan lepas serta pemilih berkas pada tab unggah. */
function pasangDrop(ref){
  const dz = document.getElementById('lpDrop'), inp = document.getElementById('lpF');
  if(!dz || !inp) return;
  const tampil = () => {
    const f = inp.files && inp.files[0];
    const el = document.getElementById('lpTerpilih');
    if(el) el.innerHTML = f
      ? '<b>' + esc(f.name) + '</b> &middot; ' + fmtUkuran(f.size) +
        (f.size > BATAS_UNGGAH ? ' <span class="pill late">melebihi 20 MB</span>' : '')
      : '';
  };
  const pick = document.getElementById('lpPick');
  if(pick) pick.onclick = () => inp.click();
  dz.onclick = e => { if(e.target === dz || e.target.closest('.dz-ic')) inp.click(); };
  inp.onchange = tampil;
  ['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(!f) return;
    try { const dt = new DataTransfer(); dt.items.add(f); inp.files = dt.files; }
    catch(err) { inp._berkas = f; }
    tampil();
  });
}

/* Mengambil berkas yang sudah terdaftar di halaman Dokumen. */

function simpanTautan(ref){
  const u = V('lpU');
  if(!u){ toast('Tautan wajib diisi.'); return; }
  if(!/^https?:\/\//i.test(u)){ toast('Tautan harus diawali http atau https.'); return; }
  const rec = {id:uid('lp'), ref:ref, nama:V('lpN') || u.slice(0, 60), jenis:'tautan', mime:'', ukuran:0,

  log('Tautan dilampirkan pada ' + ref, 'Lampiran');

function unggahBerkas(ref){
  const inp = document.getElementById('lpF');
  const f = (inp && inp.files && inp.files[0]) || (inp && inp._berkas);
  if(!f){ toast('Pilih berkasnya dulu.'); return; }
  if(f.size > BATAS_UNGGAH){ toast('Berkas ' + fmtUkuran(f.size) + ' melebihi batas 20 MB.'); return; }
  S.lampiran = S.lampiran || [];
  const rec = {id:uid('lp'), ref:ref, nama:f.name, jenis:'berkas', mime:f.type || 'application/octet-stream',
    ukuran:f.size, url:'', driveId:'', oleh:S.aktif, tgl:TODAY, status:'menunggu'};

  if(!adaPeladen()){
    if(ref === '__draf'){ draf().push(rec); closeModal(); render(); toast('Berkas dicatat, akan menyusul ke Drive.'); return; }
    S.lampiran.push(rec);
    log('Berkas ' + f.name + ' (' + fmtUkuran(f.size) + ') dicatat sebagai lampiran ' + ref + ', menunggu unggahan ke Drive', 'Lampiran');
    save(); closeModal(); render();
    toast('Berkas dicatat. Unggah manual ke folder Drive Sage lalu tempel tautannya.');
    return;
  }
  const bar = document.getElementById('lpBar');
  if(bar){ bar.style.display = 'block'; bar.firstChild.style.width = '2%'; }
  window.SIMS.unggah(f, ref, function(persen){ if(bar) bar.firstChild.style.width = Math.max(2, persen) + '%'; })
    .then(function(hasil){
      rec.url = hasil.url; rec.driveId = hasil.id; rec.status = 'siap';
      if(ref === '__draf'){ draf().push(rec); closeModal(); render(); toast('Berkas terunggah.'); return; }
      S.lampiran.push(rec);
      log('Berkas ' + f.name + ' (' + fmtUkuran(f.size) + ') diunggah ke folder Drive Sage sebagai lampiran ' + ref, 'Lampiran');
      save(); closeModal(); render(); toast('Berkas terunggah.');
    })
    .catch(function(e){ toast('Unggahan gagal: ' + e.message); if(bar) bar.style.display = 'none'; });
}

var ONBOARD = [
  ['b1','Kick-off meeting','Sifat industri, sifat bisnis, transaksi yang jadi perhatian, dan issues yang mau diimprove'],
  ['b2','Data request','Mutasi bank seluruh rekening terkait, data aset yang ada, seluruh hutang dan perjanjian hukum'],
  ['b3','Mapping untuk pengerjaan','Pemetaan akun, siklus kerja, dan penanggung jawab tiap peran']
];
function onbOf(k){
  k.onboard = k.onboard || {};
  return k.onboard;
}
function onbSelesai(k){
  const o = onbOf(k);
  return ONBOARD.filter(x => o[x[0]]).length;
}
function kartuOnboarding(k){
  const o = onbOf(k);
  const n = onbSelesai(k);
  return card('Onboarding klien baru',
    ONBOARD.map(x => '<label class="chk"><input type="checkbox" data-act="onbTik" data-id="' + k.id + '" data-k="' + x[0] + '"' +
      (o[x[0]] ? ' checked' : '') + (isMgr() || S.aktif === k.preparer ? '' : ' disabled') + '>' +
      '<span><b>' + esc(x[1]) + '</b><div class="sub">' + esc(x[2]) + '</div>' +
      (o[x[0]] ? '<div class="sub">' + esc(nama(o[x[0]].by)) + ' · ' + fmtD(o[x[0]].tgl) + '</div>' : '') +
      '</span></label>').join('') +
    (n >= ONBOARD.length ? '<div class="note">Onboarding tuntas. Klien siap masuk siklus bulanan.</div>'
      : '<div class="note warn">Siklus bulanan sebaiknya menunggu tiga langkah ini tuntas.</div>'),
    '<span class="pill ' + (n >= ONBOARD.length ? 'ok' : n ? 'run' : '') + '">' + n + '/' + ONBOARD.length + '</span>');
}
function onbTik(kid, kode, on){
  const k = klienOf(kid);
  const o = onbOf(k);
  if(on){
    o[kode] = {by:S.aktif, tgl:TODAY};
    log('Onboarding ' + k.nama + ': langkah "' + ONBOARD.find(x => x[0] === kode)[1] + '" selesai', 'C.1');
    save(); render(); return;
  }
  delete o[kode];
  log('Onboarding ' + k.nama + ': langkah "' + ONBOARD.find(x => x[0] === kode)[1] + '" dibuka lagi', 'C.1');
  save(); render();
}

/* ============================================================
   Tenggat periode — ditetapkan Manager tiap awal bulan.
   Dua tenggat, yaitu batas laporan manajemen selesai dan
   batas seluruh proses perpajakan selesai.
   ============================================================ */
function targetOf(per){ return (S.target || []).find(t => t.periode === per) || null; }
function targetUsul(per){ return {laporan: addWork(lastDay(per), aturan('hariLaporan')), pajak: addWork(lastDay(per), aturan('hariPajak'))}; }
function batasLaporanPeriode(per){ const t = targetOf(per); return t && t.laporan ? t.laporan : targetUsul(per).laporan; }
function batasPajakPeriode(per){ const t = targetOf(per); return t && t.pajak ? t.pajak : targetUsul(per).pajak; }
function bolehTarget(){ return isMgr(); }

/* Kartu yang dipasang di Laporan Manajemen dan Kepatuhan Pajak. */
function kartuTarget(per, jenis){
  const t = targetOf(per), u = targetUsul(per);
  const tgl = jenis === 'pajak' ? (t && t.pajak) : (t && t.laporan);
  const usul = jenis === 'pajak' ? u.pajak : u.laporan;
  const lab = jenis === 'pajak' ? 'Batas proses perpajakan selesai' : 'Batas laporan manajemen selesai';
  /* satu tenggat berlaku untuk dua modul, dikunci pada periode buku yang sedang dikerjakan */
  const tombol = bolehTarget()
    ? '<button class="btn sm' + (tgl ? ' ghost' : '') + '" data-act="formTarget" data-v="' + per + '">' +
      (tgl ? 'Ubah tenggat' : 'Tetapkan tenggat') + '</button>' : '';
  if(!tgl) return '<div class="note warn">Manager belum menetapkan ' + lab.toLowerCase() + ' untuk periode ' + fmtP(per) +
    '. Sementara ini sistem memakai usulan ' + fmtD(usul) + ', yaitu ' + (jenis === 'pajak' ? aturan('hariPajak') : aturan('hariLaporan')) +
    ' hari kerja sejak awal bulan berikutnya. ' + (bolehTarget() ? '' : 'Minta Manager menetapkannya.') + '</div>' +
    (tombol ? '<div class="row-btn" style="margin:0 0 14px">' + tombol + '</div>' : '');
  return card(lab + ' &middot; ' + fmtP(per),
    '<div class="rowline"><div><b>' + fmtD(tgl) + '</b><div class="mini">ditetapkan ' + esc(nama(t.oleh)) + ' pada ' + fmtD(t.tgl) + '</div></div>' +
    '<div class="g">' + sisaPill(tgl, 0) + '</div></div>' +
    (t.catatan ? '<div class="mini" style="margin-top:6px">' + esc(t.catatan) + '</div>' : ''), tombol);
}

function formTarget(per){
  if(!bolehTarget()){ toast('Hanya Manager dan Director yang menetapkan tenggat periode.'); return; }
  const t = targetOf(per) || {}, u = targetUsul(per);
  modal('Tenggat periode ' + fmtP(per),
    '<div class="grid2">' +
    fl('Batas laporan manajemen selesai','tgL', t.laporan || u.laporan,'date') +
    fl('Batas proses perpajakan selesai','tgP', t.pajak || u.pajak,'date') +
    '</div>' +
    '<label class="fl">Catatan untuk tim<textarea id="tgC" rows="2">' + esc(t.catatan || '') + '</textarea></label>' +
    '<div class="note">Usulan sistem ' + fmtD(u.laporan) + ' untuk laporan dan ' + fmtD(u.pajak) +
    ' untuk perpajakan. Tenggat yang Anda tetapkan menggantikan usulan itu dan dipakai seluruh berkas periode ini.</div>',
    '<button class="btn ghost" data-act="close">Batal</button>' +
    '<button class="btn" data-act="simpanTarget" data-v="' + per + '">Tetapkan</button>', 1);
}

function simpanTarget(per){
  const l = V('tgL'), p = V('tgP');
  if(!l || !p){ toast('Kedua tenggat wajib diisi.'); return; }
  if(diff(l, p) < 0){ toast('Batas perpajakan tidak boleh lebih awal daripada batas laporan.'); return; }
  S.target = S.target || [];
  const lama = targetOf(per);
  const rec = {periode:per, laporan:l, pajak:p, catatan:V('tgC'), oleh:S.aktif, tgl:TODAY};
  if(lama) Object.assign(lama, rec); else S.target.push(rec);
  /* seluruh berkas periode ini mengikuti tenggat baru, kecuali yang sudah terkirim */
  let n = 0;
  (S.lm || []).filter(x => x.periode === per && !x.kirim && !x.custom).forEach(x => { x.deliverBy = l; x.batasPajak = p; n++; });
  const khusus = (S.lm || []).filter(x => x.periode === per && x.custom).length;
  buatNotif(S.tim.filter(t => t.aktif && t.peran !== 'klien').map(t => t.id),
    'Tenggat periode ' + fmtP(per) + ' ditetapkan', 'Laporan ' + fmtD(l) + ', perpajakan ' + fmtD(p), 'lm', '');
  log('Tenggat periode ' + fmtP(per) + ' ditetapkan: laporan ' + fmtD(l) + ', perpajakan ' + fmtD(p) +
    (n ? ', ' + n + ' berkas menyesuaikan' : '') + (khusus ? ', ' + khusus + ' berkas memakai tenggat khusus' : ''), 'C.3');
  save(); closeModal(); render(); toast('Tenggat periode tersimpan.');
}

   Sambungan Google Calendar.
   Undangan sungguhan dikirim lewat Apps Script. Tanpa peladen,
   sistem hanya mencatat daftar tamu dan menandainya menunggu.
   ============================================================ */
function adaKalender(){ return typeof window !== 'undefined' && window.SIMS && typeof window.SIMS.rapatBuat === 'function'; }

/* Daftar alamat surel yang akan diundang untuk satu rapat. */
function tamuRapat(m){
  const dalam = (m.peserta || []).map(u => (S.tim.find(t => t.id === u) || {}).email).filter(Boolean);
  const kl = m.klien ? klienOf(m.klien) : null;
  const klienMail = kl && kl.portal && kl.login ? [kl.login] : [];
  return [...new Set([...dalam, ...klienMail, ...(m.luar || [])])];
}

function kirimUndangan(m, ubah){
  if(!adaKalender()){
    m.gcalStatus = 'menunggu';
    return Promise.resolve({ok:false, alasan:'peladen'});
  }
  m.gcalStatus = 'mengirim'; render();
  return window.SIMS.rapatBuat({
    id: m.id, judul: (m.jenis || 'Meeting') + (m.klien ? ' · ' + klienOf(m.klien).nama : ''),
    tgl: m.tgl, jam: m.jam, durasi: m.durasi || 60, mode: m.mode,
    lokasi: m.lokasi || '', link: m.link || '', catatan: m.usul || '',
    tamu: tamuRapat(m), eventId: m.gcalId || '', ubah: !!ubah
  }).then(function (r) {
    m.gcalId = r.id; m.gcalLink = r.tautan; m.gcalStatus = 'terkirim'; m.gcalKirim = TODAY;
    log('Undangan Google Calendar ' + (ubah ? 'diperbarui' : 'dikirim') + ' untuk rapat ' + fmtD(m.tgl) +
      ' ke ' + tamuRapat(m).length + ' alamat', 'D.1');
    save(); render(); toast('Undangan Google Calendar terkirim ke ' + tamuRapat(m).length + ' alamat.');
    return {ok:true};
  }).catch(function (e) {
    m.gcalStatus = 'gagal'; m.gcalPesan = e.message;
    save(); render(); toast('Undangan gagal terkirim: ' + e.message);
    return {ok:false, alasan:e.message};
  });
}

function batalUndangan(id){
  const m = S.meeting.find(x => x.id === id);
  if(!m) return;
  if(!adaKalender() || !m.gcalId){ m.gcalStatus = 'dibatalkan'; save(); render(); return; }
  window.SIMS.rapatBatal(m.gcalId).then(function () {
    m.gcalStatus = 'dibatalkan';
    log('Event Google Calendar rapat ' + fmtD(m.tgl) + ' dibatalkan, pemberitahuan dikirim ke tamu', 'D.1');
    save(); render(); toast('Event kalender dibatalkan.');
  }).catch(function (e) { toast('Pembatalan gagal: ' + e.message); });
}

/* ============================================================
   Pencarian menyeluruh.
   Dipakai kolom cari pada kepala beranda ponsel, dan bisa juga
   dibuka dari menu Lainnya.
   ============================================================ */
function hasilCari(q){
  q = String(q || '').trim().toLowerCase();
  if(q.length < 2) return [];
  const ids = myKlienIds();
  const cocok = t => String(t || '').toLowerCase().includes(q);
  const out = [];

  (S.klien || []).filter(k => ids.includes(k.id)).forEach(k => {
    if(cocok(k.nama) || cocok(k.alias) || cocok(k.group))
      out.push({jenis:'Klien', judul:k.nama, ket:[k.alias, k.layanan && k.layanan.acc ? 'Akuntansi' : '', k.layanan && k.layanan.tax ? 'Pajak' : ''].filter(Boolean).join(' · '),
        page:'klien', sel:{klien:k.id}});
  });
  (S.tugas || []).forEach(t => {
    if(!cocok(t.judul) && !cocok(t.catatan)) return;
    if(t.klien && !ids.includes(t.klien)) return;
    out.push({jenis:'Tugas', judul:t.judul, ket:(t.klien ? klienOf(t.klien).nama + ' · ' : '') + t.status + ' · tenggat ' + fmtD(t.tenggat), page:'tugas'});
  });
  (S.internal || []).forEach(x => {
    if(cocok(x.nama)) out.push({jenis:'Kerjaan internal', judul:x.nama, ket:x.kelompok + ' · ' + nama(x.pic), page:'internal'});
  });
  (S.lm || []).filter(l => ids.includes(l.klien)).forEach(l => {
    if(cocok(klienOf(l.klien).nama) || cocok(l.deliverable))
      out.push({jenis:'Laporan Manajemen', judul:klienOf(l.klien).nama + ' · ' + fmtP(l.periode),
        ket:(l.kirim ? 'terkirim ' + fmtDS(l.kirim) : 'batas ' + fmtD(l.deliverBy || batasLaporanPeriode(l.periode))), page:'lm', buka:l.id});
  });
  (S.dok || []).filter(d => ids.includes(d.klien)).forEach(d => {
    if(cocok(d.nama) || cocok(d.jenis))
      out.push({jenis:'Dokumen', judul:d.nama, ket:klienOf(d.klien).nama + ' · ' + d.jenis, page:'dok'});
  });
  (S.meeting || []).filter(m => !m.klien || ids.includes(m.klien)).forEach(m => {
    if(cocok(m.jenis) || cocok(m.klien ? klienOf(m.klien).nama : '') || cocok(m.usul))
      out.push({jenis:'Rapat', judul:(m.klien ? klienOf(m.klien).nama : m.jenis), ket:fmtD(m.tgl) + ' · ' + m.jam + ' · ' + m.mode, page:'meeting'});
  });
  (S.pesan || []).forEach(p => {
    if(cocok(p.subjek)) out.push({jenis:'Pesan', judul:p.subjek, ket:(p.klien ? klienOf(p.klien).nama + ' · ' : '') + (p.pesan || []).length + ' pesan', page:'pesan', sel:{pesan:p.id}});
  });
  return out.slice(0, 60);
}

function pgCari(){

  hasil.forEach(h => { (kelompok[h.jenis] = kelompok[h.jenis] || []).push(h); });

  let h = head('Pencarian', 'Cari di seluruh sistem', '');
  h += '<div class="card"><div class="card-body">' +
    '<label class="cari-page"><span>&#9906;</span>' +
    '<input id="qCariBesar" placeholder="Ketik nama klien, judul tugas, atau nama dokumen" value="' + esc(q) + '"></label>' +
    '</div></div>';

  if(q.trim().length < 2) return h + card('Mulai mengetik', '<div class="hint">Masukkan minimal dua huruf. Pencarian mencakup klien, tugas, kerjaan internal, berkas Laporan Manajemen, dokumen, rapat, dan pesan yang boleh Anda lihat.</div>');
  if(!hasil.length) return h + card('Tidak ada yang cocok', '<div class="hint">Tidak ada data yang cocok dengan "' + esc(q) + '".</div>');

  h += '<div class="mini" style="margin:2px 2px 10px">' + hasil.length + ' hasil untuk "' + esc(q) + '"</div>';
  Object.keys(kelompok).forEach(j => {
    h += card(j + ' <span class="pill">' + kelompok[j].length + '</span>',

        '<div class="carirow" data-act="bukaCari" data-v="' + esc(JSON.stringify(x)) + '">' +
        '<div class="lamp-info"><b>' + esc(x.judul) + '</b><div class="mini">' + esc(x.ket) + '</div></div>' +

  return h;
}

/* Nilai bawaan. Dipakai bila belum pernah diubah. */
const ATURAN_BAWAAN = {
  hariLaporan: 7,        // hari kerja sejak awal bulan berikutnya untuk batas laporan
  hariPajak: 15,         // hari kerja untuk usulan batas proses perpajakan
  hariAnalisa: 4,        // hari kerja sejak dokumen diterima untuk analisa mutasi
  hariReview: 3,         // hari kerja per tahap review
  hariFollowUp: 7,       // hari sejak penawaran dikirim sampai perlu ditindaklanjuti
  barisTabel: 10,        // baris per halaman pada seluruh tabel
  batasLampiranMB: 20,   // batas ukuran satu lampiran
  targetKontenStatis: 8, // target konten statis per bulan
  targetKontenVideo: 4,  // target video per bulan
  umurSesiJam: 8         // umur sesi sebelum diminta masuk lagi
};

const ATURAN_LABEL = {
  hariLaporan: ['Batas laporan manajemen', 'hari kerja sejak awal bulan berikutnya, dipakai sebagai usulan tenggat periode'],
  hariPajak: ['Batas proses perpajakan', 'hari kerja, dipakai sebagai usulan tenggat perpajakan'],
  hariAnalisa: ['Batas analisa mutasi', 'hari kerja sejak tanggal dokumen klien diterima'],
  hariReview: ['Batas tiap tahap review', 'hari kerja sebelum tahap review dianggap tertahan'],
  hariFollowUp: ['Tindak lanjut penawaran', 'hari sejak surat penawaran dikirim'],
  barisTabel: ['Baris per halaman', 'jumlah baris yang ditampilkan tiap tabel'],
  batasLampiranMB: ['Batas ukuran lampiran', 'megabita per berkas'],
  targetKontenStatis: ['Target konten statis', 'unggahan per bulan'],
  targetKontenVideo: ['Target video', 'unggahan per bulan'],
  umurSesiJam: ['Umur sesi', 'jam sebelum pengguna diminta masuk lagi']
};

function aturan(k){
  const v = S.aturan ? S.aturan[k] : undefined;
  const n = Number(v);
  return (v === undefined || v === '' || isNaN(n)) ? ATURAN_BAWAAN[k] : n;
}

function formAturan(){
  if(!isDir()){ toast('Hanya Director yang boleh mengubah aturan sistem.'); return; }
  modal('Aturan sistem',
    '<div class="note">Angka berikut dipakai seluruh modul. Mengubahnya berlaku untuk perhitungan berikutnya, bukan mengubah tenggat yang sudah ditetapkan Manager.</div>' +
    Object.keys(ATURAN_LABEL).map(k =>
      '<label class="fl">' + ATURAN_LABEL[k][0] +
      '<div class="mini" style="font-weight:400;text-transform:none;letter-spacing:0">' + ATURAN_LABEL[k][1] + '</div>' +
      '<input id="at-' + k + '" type="number" min="1" value="' + aturan(k) + '"></label>').join(''),
    '<button class="btn ghost" data-act="close">Batal</button>' +
    '<button class="btn" data-act="simpanAturan">Simpan aturan</button>', 1);
}

function simpanAturan(){
  if(!isDir()){ toast('Hanya Director yang boleh mengubah aturan sistem.'); return; }
  S.aturan = S.aturan || {};
  const ubah = [];
  Object.keys(ATURAN_LABEL).forEach(k => {
    const el = document.getElementById('at-' + k);
    if(!el) return;
    const n = Math.max(1, Math.round(Number(el.value) || ATURAN_BAWAAN[k]));
    if(aturan(k) !== n){ ubah.push(ATURAN_LABEL[k][0] + ' ' + aturan(k) + ' menjadi ' + n); S.aturan[k] = n; }
  });
  if(!ubah.length){ closeModal(); toast('Tidak ada perubahan.'); return; }
  if(adaBasis() && window.SIMS.simpanAturan) window.SIMS.simpanAturan(S.aturan).catch(e => toast('Peladen menolak: ' + e.message));
  log('Aturan sistem diubah: ' + ubah.join(', '), 'Sistem');
  save(); closeModal(); render(); toast('Aturan sistem tersimpan.');
}

/* Otomasi yang tidak boleh dimatikan, karena mematikannya membuat
   satu periode kerja hilang tanpa ada yang menyadari. */
const OTOMASI_WAJIB = ['j1', 'j3', 'j11'];

function otomasiSemua(){
  S.otomasi = S.otomasi || [];
  return JOBS.map(j => {
    const simpan = S.otomasi.find(x => x.id === j.id) || {};
    return {
      id: j.id, modul: j.modul, aksi: j.aksi, jalan: j.jalan,
      kapan: simpan.kapan || j.kapan,
      ke: simpan.ke || j.ke,
      aktif: simpan.aktif === undefined ? 1 : Number(simpan.aktif),
      catatan: simpan.catatan || '',
      terakhir: simpan.terakhir || '',
      hasil: simpan.hasil || '',
      wajib: OTOMASI_WAJIB.includes(j.id) ? 1 : 0
    };
  });
}
function otomasiOf(id){ return otomasiSemua().find(x => x.id === id); }

function formOtomasi(id){
  if(!isDir()){ toast('Hanya Director yang boleh mengatur otomasi.'); return; }
  const o = otomasiOf(id);
  if(!o) return;
  modal('Atur otomasi',
    '<div class="rowline"><div><b>' + esc(o.aksi) + '</b><div class="mini">Modul ' + esc(o.modul) + '</div></div></div>' +
    fl('Waktu pemicu','otK', o.kapan) +
    fl('Penerima','otP', o.ke) +
    '<label class="fl">Catatan untuk tim<textarea id="otC" rows="2">' + esc(o.catatan) + '</textarea></label>' +
    '<label class="chk"><input type="checkbox" id="otA"' + (o.aktif ? ' checked' : '') + (o.wajib ? ' disabled' : '') + '>' +
    '<span>Otomasi ini aktif' +
    (o.wajib ? '<div class="sub">Otomasi ini tidak dapat dimatikan. Mematikannya membuat satu periode kerja tidak pernah terbentuk dan keterlambatannya baru ketahuan setelah lewat tenggat. Waktu pemicunya tetap boleh diubah.</div>'
             : '<div class="sub">Bila dimatikan, sistem tidak menjalankannya dan tidak ada penggantinya.</div>') +
    '</span></label>',
    '<button class="btn ghost" data-act="close">Batal</button>' +
    '<button class="btn" data-act="simpanOtomasi" data-id="' + id + '">Simpan</button>', 1);
}

function simpanOtomasi(id){
  if(!isDir()){ toast('Hanya Director yang boleh mengatur otomasi.'); return; }
  const o = otomasiOf(id);
  const kapan = V('otK'), ke = V('otP');
  if(!kapan){ toast('Waktu pemicu wajib diisi.'); return; }
  const aktifBaru = o.wajib ? 1 : (CEK('otA') ? 1 : 0);
  S.otomasi = S.otomasi || [];
  let rec = S.otomasi.find(x => x.id === id);
  if(!rec){ rec = {id:id}; S.otomasi.push(rec); }
  const jejak = [];
  if(rec.kapan !== kapan && o.kapan !== kapan) jejak.push('waktu jadi ' + kapan);
  if(o.ke !== ke) jejak.push('penerima jadi ' + ke);
  if(o.aktif !== aktifBaru) jejak.push(aktifBaru ? 'dinyalakan' : 'dimatikan');
  Object.assign(rec, {kapan:kapan, ke:ke, catatan:V('otC'), aktif:aktifBaru});
  if(adaBasis() && window.SIMS.simpanOtomasi) window.SIMS.simpanOtomasi(rec).catch(e => toast('Peladen menolak: ' + e.message));
  log('Otomasi ' + id + ' diatur' + (jejak.length ? ': ' + jejak.join(', ') : ''), 'Sistem');
  save(); closeModal(); render(); toast('Otomasi tersimpan.');
}

function catatOtomasiJalan(id, hasil){
  S.otomasi = S.otomasi || [];
  let rec = S.otomasi.find(x => x.id === id);
  if(!rec){ rec = {id:id}; S.otomasi.push(rec); }
  rec.terakhir = TODAY + ' ' + jamKini();
  rec.hasil = String(hasil || '').slice(0, 140);
}

function render(){

  if(S.aktif && !akunKlien() && !S.tim.some(t => t.id === S.aktif)) S.aktif = null;
  if(!S.aktif){ document.body.classList.add('keluar'); document.getElementById('view').innerHTML = layarMasuk(); return; }
  document.body.classList.remove('keluar');
  if(!boleh(UI.page)) UI.page = peran() === 'klien' ? 'portal' : 'dash';
  document.body.classList.toggle('mode-klien', peran() === 'klien');
  drawNav();
  document.getElementById('tbTitle').textContent = peran() === 'klien'
    ? ({ringkas:'Ringkasan', tugas:'Tugas Saya', pesan:'Pesan', rapat:'Rapat', notulen:'Notulen', berkas:'Laporan & Tagihan'}[UI.tab.pk || 'ringkas'])
    : JUDUL[UI.page];
  document.getElementById('tbCrumb').textContent = 'SIMS · ' + me().nama + ' · ' + fmtP(S.periodeAktif);
  document.getElementById('view').innerHTML = PAGES[UI.page]();
}

/* Perpindahan halaman digambar setelah satu bingkai, supaya ketukan langsung
   terlihat bereaksi dan tidak menunggu seluruh halaman selesai disusun. */
const AKSI_PINDAH = {go:1, tabHp:1, pkTab:1};
function pindahHalaman(fn, el){
  /* Penundaan satu bingkai hanya berguna di ponsel. Di layar lebar halaman
     berpindah langsung supaya tidak ada jeda yang tidak perlu. */
  if(!hp()) { fn(); return; }
  if(el) el.classList.add('sedang');
  document.body.classList.add('memuat');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fn();
    document.body.classList.remove('memuat');
  }));
}

document.addEventListener('change', e => {

document.addEventListener('input', e => {
  if(e.target.id === 'qCari' || e.target.id === 'qCariBesar'){
    UI.q.cari = e.target.value;
    const besar = e.target.id === 'qCariBesar';
    if(!besar && UI.q.cari.trim().length < 2) return;
    if(UI.page !== 'cari'){ UI.page = 'cari'; }
    render();
    const f = document.getElementById('qCariBesar');
    if(f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
    return;
  }
  if(e.target.id === 'qLampDok'){ UI.q.lampDok = e.target.value; formLampiran(e.target.closest('.modal').querySelector('[data-act=lampTab]').dataset.r, 'dokumen');
    const x = document.getElementById('qLampDok'); if(x){ x.focus(); x.setSelectionRange(x.value.length, x.value.length); } return; }
  if(e.target.dataset && e.target.dataset.tblq){
    const kk = e.target.dataset.tblq, pos = e.target.selectionStart;
    UI.tbl[kk].q = e.target.value; UI.tbl[kk].p = 1; render();
    const x = document.querySelector('[data-tblq="' + kk.replace(/"/g,'\\"') + '"]');
    if(x){ x.focus(); x.setSelectionRange(pos, pos); }
    return;
  }
  if(e.target.id === 'qTugas'){ UI.q.tugas = e.target.value; render(); const x = document.getElementById('qTugas'); if(x){ x.focus(); x.setSelectionRange(x.value.length,x.value.length); } }
  if(e.target.id === 'qPesan'){ UI.q.pesan = e.target.value; render(); const x = document.getElementById('qPesan'); if(x){ x.focus(); x.setSelectionRange(x.value.length,x.value.length); } }
  if(e.target.id === 'qKlien'){ UI.q.klien = e.target.value; render(); const x = document.getElementById('qKlien'); if(x){ x.focus(); x.setSelectionRange(x.value.length,x.value.length); } }
  if(e.target.id === 'qDok'){ UI.q.dok = e.target.value; render(); const x = document.getElementById('qDok'); if(x){ x.focus(); x.setSelectionRange(x.value.length,x.value.length); } }
  if(e.target.id === 'qProd'){ UI.q.prod = e.target.value; const p = document.querySelector('.board'); if(p){ render(); document.getElementById('qProd').focus(); } }
});

   jadi halaman disusun ulang sekali saat ambangnya terlewati. */
let _lebarHp = null;
window.addEventListener('resize', () => {
  const kini = hp();
  if(_lebarHp === null){ _lebarHp = kini; return; }
  if(kini !== _lebarHp){ _lebarHp = kini; if(S && S.aktif) render(); }
});

/* ================= mulai ================= */
(async function init(){
  const saved = await loadState();
  if(saved && saved.skema === SKEMA_VERSI) S = saved;
  else S = seedKosong();
  ['klien','rekening','project','produksi','analisa','konfirm','laporan','review','dokreq','periode','patuh',
   'tugas','cuti','meeting','notulen','aksi','sesiReview','invoice','bayar','lead','gaji','konten','seo',
   'lm','dok','pesan','notif','lampiran','internal','target','gcal','otomasi','progres','otomasiLog','log',
   'tim','kewajiban','libur','akun'].forEach(k => { if(!Array.isArray(S[k])) S[k] = []; });
  if(!S.aturan) S.aturan = {};
  if(!S.ulasan) S.ulasan = {target:6, jumlah:0, rata:0, profil:{kategori:0, jam:0, foto:0, deskripsi:0, kontak:0}, minta:[]};
  if(!S.periodeAktif) S.periodeAktif = TODAY.slice(0,7);
  if(!S.periodeKepatuhan) S.periodeKepatuhan = TODAY.slice(0,7);
  S.tugas.forEach(x => { x.pihak = x.pihak || 'internal'; x.catatan = x.catatan || ''; });

  /* Berkas ini tidak lagi membawa data apa pun. Seluruh isinya berasal dari
     Spreadsheet lewat Apps Script. Bila jembatan tersedia, data ditarik sekarang. */
  if(typeof window !== 'undefined' && window.SIMS && typeof window.SIMS.muat === 'function'){
    try {
      const st = await window.SIMS.muat();
      if(st){ S = st; if(!S.aturan) S.aturan = {}; }
    } catch(e){ /* belum masuk atau sambungan gagal, layar masuk yang tampil */ }
  }
  render();
})();
