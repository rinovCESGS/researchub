<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIMS — Sage Internal Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Palet kantor jasa keuangan: navy tenang sebagai warna utama,
     emas tua sebagai aksen, dan hijau tua untuk angka yang sehat. */
  --ink:#0E1B2E; --muted:#5A6A80; --faint:#8C9AAD;
  --bg:#F4F6F9; --card:#FFFFFF; --line:#DFE5EC; --line2:#EEF2F6;
  --em900:#0B1B33; --em800:#12294A; --em700:#1A3A63; --em600:#234F82; --em500:#3B6E9E; --em100:#D3DEEA; --em50:#F0F4F8;
  --grad:linear-gradient(135deg,#0B1B33 0%,#12294A 45%,#1A3A63 78%,#234F82 100%);
  --grad-btn:linear-gradient(100deg,#12294A 0%,#1A3A63 55%,#234F82 100%);
  --gold:#A57C21; --gold500:#C9A227; --gold50:#FBF6E8; --goldline:#EADFBF;
  --red:#B3261E; --red50:#FCF2F1; --amber:#9A6B08; --amber50:#FDF7EA; --slate:#64748B; --slate50:#F1F4F8;
  --hijau:#12664A; --hijau50:#EDF6F2;
  --r:12px; --shadow:0 1px 2px rgba(11,27,51,.05), 0 6px 18px rgba(11,27,51,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,Segoe UI,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.brand,.kpi-num,.page-title,.card-title,.tile b{font-family:Montserrat,Inter,sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--em700)}
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:var(--grad);display:flex;align-items:center;gap:14px;padding:0 18px;z-index:40;color:#EAF5F1}
.tb-title{font-family:Montserrat;font-weight:600;font-size:15px;color:#fff;line-height:1.2}
.crumb{font-size:11.5px;color:#8FC5B4}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.roleswitch{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.10);border-radius:999px;padding:4px 6px 4px 12px}
.roleswitch span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9FD3C3}
.roleswitch select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;outline:none}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#9FD3C3}
.dot{width:7px;height:7px;border-radius:50%;background:var(--em500);box-shadow:0 0 0 3px rgba(32,167,201,.25)}
.burger{display:none;background:transparent;border:0;color:#fff;font-size:19px;cursor:pointer}
.sidebar{position:fixed;top:56px;bottom:0;left:0;width:246px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;z-index:30;padding:14px 12px 28px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 10px}
.brand .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--em600),var(--em800));color:#fff;display:grid;place-items:center;font-family:Montserrat;font-weight:700;font-size:13px}
.brand b{font-family:Montserrat;font-size:14.5px;font-weight:700;display:block;line-height:1.1}
.brand small{font-size:10.5px;color:var(--faint);letter-spacing:.04em}
.navgroup{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:13px 10px 5px;font-weight:600}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:#33453E;font-size:13.5px;font-weight:500;margin-bottom:1px}
.navitem:hover{background:var(--em50)}
.navitem.active{background:var(--grad-btn);color:#fff}
.navitem .ic{width:16px;text-align:center;font-size:12px;opacity:.85}
.navitem .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 6px;font-weight:600}
.navitem.active .badge{background:#fff;color:var(--em800)}
.usercard{margin-top:14px;border-top:1px solid var(--line2);padding-top:12px;display:flex;gap:9px;align-items:center;padding-left:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--em100);color:var(--em800);display:grid;place-items:center;font-weight:600;font-size:12px;font-family:Montserrat}
.main{margin-left:246px;padding:76px 26px 60px;max-width:1520px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--em700);font-weight:600}
.page-title{font-size:22px;font-weight:700;margin:3px 0 2px}
.page-sub{color:var(--muted);font-size:13px}
.head-row{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.head-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{background:var(--grad-btn);color:#fff;border:1px solid var(--em700);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:linear-gradient(100deg,#062A33,#0B4552 55%,#116A7B);border-color:var(--em900)}
.btn.ghost{background:#fff;color:#294a3f;border-color:var(--line)}
.btn.ghost:hover{background:var(--em50);border-color:var(--em100)}
.btn.warn{background:#fff;color:var(--red);border-color:#F3C9C2}
.btn.warn:hover{background:var(--red50)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500;background:var(--slate50);color:#41524B;white-space:nowrap}
.pill.ok{background:var(--hijau50);color:var(--hijau)}
.pill.run{background:#EFF6FF;color:#1D4ED8}
.pill.wait{background:var(--amber50);color:var(--amber)}
.pill.late{background:var(--red50);color:var(--red)}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px;width:fit-content;flex-wrap:wrap}
.tab{padding:6px 15px;border-radius:999px;font-size:13px;cursor:pointer;color:#486057;font-weight:500}
.tab.active{background:var(--grad-btn);color:#fff}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-width:200px}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-head{padding:14px 16px 0;display:flex;align-items:center;gap:10px}
.card-title{font-size:14px;font-weight:600}
.card-body{padding:14px 16px 16px}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.stack>*{min-width:0}
.split>*{min-width:0}
.card,.card-body,.mailview,.tbl-wrap{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.7fr 1fr;align-items:start}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kpi-num{font-size:26px;font-weight:700;line-height:1.15;margin-top:5px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.alert{border-color:#F5D3CD;background:linear-gradient(#fff,#FFF8F7)}
.kpi.alert .kpi-num{color:var(--red)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:#F7FAF9;padding:9px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:top}
tbody tr:hover{background:#FAFCFB}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--shadow)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:Montserrat;color:var(--ink);margin-bottom:4px}
.chk{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:13px}
.chk input{margin-top:3px;accent-color:var(--em600);width:15px;height:15px}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:500;margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;background:#fff}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--em500);box-shadow:0 0 0 3px var(--em50)}
.hint{font-size:12px;color:var(--muted)}
.note{border-left:3px solid var(--em500);background:var(--em50);padding:10px 13px;border-radius:0 8px 8px 0;font-size:12.5px;color:#14414E}
.note.warn{border-color:var(--amber);background:var(--amber50);color:#7A4A08}
.note.stop{border-color:var(--red);background:var(--red50);color:#8A2318}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.col{min-width:206px;flex:1 0 206px;background:#EDF3F1;border-radius:var(--r);padding:10px;border:1px solid var(--line)}
.col h4{margin:0;font-size:12px;display:flex;align-items:center;gap:6px}
.col .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.stepno{width:17px;height:17px;border-radius:5px;background:var(--em700);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.tile{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:8px;cursor:pointer;box-shadow:0 1px 2px rgba(6,42,51,.05)}
.tile:hover{border-color:var(--em500)}
.tile b{font-size:12.8px;display:block;font-weight:600}
.tile .m{font-size:11.5px;color:var(--muted);margin-top:2px}
.tile .foot{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.tile.pri{border-left:3px solid var(--em600)}
.tile.od{border-left:3px solid var(--red)}
.matrix td,.matrix th{border:1px solid var(--line2);padding:6px 8px;font-size:12.5px}
.cell{display:block;width:100%;border-radius:6px;padding:5px 4px;text-align:center;font-size:11px;font-weight:600;cursor:pointer;border:1px solid transparent}
.cell.c0{background:#F1F5F4;color:#7A8A84}
.cell.c1{background:var(--amber50);color:var(--amber);border-color:#F3E3C0}
.cell.c2{background:var(--em50);color:var(--em800);border-color:#BEE3EE}
.cell.c3{background:var(--red50);color:var(--red);border-color:#F5D3CD}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.scrim{position:fixed;inset:0;background:rgba(6,31,26,.44);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:56px 16px;overflow-y:auto}
.scrim.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(6,42,51,.28);animation:pop .16s ease-out;height:fit-content}
.modal.wide{max-width:880px}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.mh{padding:15px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.mh h3{margin:0;font-size:16px;font-weight:600}
.mh .x{margin-left:auto;background:transparent;border:0;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.mb{padding:16px 20px;max-height:66vh;overflow-y:auto}
.mf{padding:13px 20px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;background:#FAFCFB;border-radius:0 0 14px 14px;flex-wrap:wrap}
.toast{position:fixed;right:20px;bottom:22px;background:var(--em900);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;z-index:80;box-shadow:0 10px 30px rgba(6,42,51,.32);opacity:0;transform:translateY(8px);transition:.2s;max-width:340px}
.toast.on{opacity:1;transform:none}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:15px}
.timeline .ev{position:relative;padding-bottom:12px;font-size:12.5px}
.timeline .ev::before{content:'';position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--em500);border:2px solid #fff}
.stepbar{display:flex;gap:5px;margin:9px 0}
.step{flex:1;height:5px;border-radius:3px;background:var(--line)}
.step.done{background:var(--em500)}
.step.now{background:var(--amber)}
.bar{height:7px;border-radius:4px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--em600)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cald{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:86px;padding:6px}
.cald .dn{font-size:11px;color:var(--muted);font-weight:600}
.cald.wk{background:#F7FAF9}
.cald.hol{background:var(--red50);border-color:#F5D3CD}
.cald.today{border-color:var(--em500);box-shadow:0 0 0 2px var(--em50)}
.cald .ev{font-size:10px;background:var(--em50);color:var(--em800);border-radius:5px;padding:2px 5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cald .ev.d{background:var(--red50);color:var(--red)}
.cald .ev.l{background:var(--amber50);color:var(--amber)}
.cald .ev.b{background:#EFF6FF;color:#1D4ED8}
.dowhead{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;text-align:center}
.masked{letter-spacing:.05em;color:var(--muted)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:10px 12px;font-size:12.5px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;cursor:pointer}
.pager button.on{background:var(--em700);color:#fff;border-color:var(--em700)}
.split{display:grid;grid-template-columns:1fr 350px;gap:14px;align-items:start}
.rowline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.rowline:last-child{border-bottom:0}
.rowline .g{margin-left:auto;display:flex;gap:6px;align-items:center}
.mini{font-size:11.5px;color:var(--muted)}
.hstack{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.g23,.split{grid-template-columns:1fr}}
@media(max-width:820px){
  .sidebar{transform:translateX(-100%);transition:.2s;width:min(300px,86vw)}
  .sidebar.open{transform:none;box-shadow:0 12px 40px rgba(6,42,51,.2)}
  .main{margin-left:0;padding:70px 12px 60px}.burger{display:block}
  .g4{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}
  .kpi{padding:12px}.kpi .lab{font-size:9.5px}
  .roleswitch span{display:none}
  /* topbar satu baris, judul tidak membungkus, remah dipendekkan */
  .topbar{gap:9px;padding:0 10px}
  .tb-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
  .crumb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw;font-size:10.5px}
  .tb-right{gap:7px}
  .sync{display:none}
  .profbtn .pnm{display:none}
  .profbtn{padding:4px 7px 4px 4px}
  .pop{right:8px;left:8px;width:auto;top:60px}
  /* kepala halaman dan tombol */
  .head-row{flex-direction:column;align-items:flex-start;gap:10px}
  .head-actions{display:flex;flex-wrap:wrap;gap:8px;width:100%}
  .page-title{font-size:21px}
  .tabs{display:flex;width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap}
  /* tabel bisa digeser mendatar, bukan terpotong */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* Lebar kolom dibiarkan mengikuti isi. Mengunci lebar sempat dicoba demi kecepatan,
     tetapi membuat kolom saling menghimpit sampai teksnya menumpuk. */
  .tbl-wrap table{min-width:720px}
  .tbl-wrap th,.tbl-wrap td{white-space:nowrap}
  .tbl-wrap td b,.tbl-wrap td .mini,.tbl-wrap td .sub{white-space:normal}
  .tbl-wrap .tag,.tbl-wrap .pill{white-space:nowrap}
  .mtx{min-width:760px}
  /* kolom pertama menempel supaya nama klien tetap terlihat saat tabel digeser */
  .tbl-wrap th:first-child,.tbl-wrap td:first-child{position:sticky;left:0;z-index:2;
    min-width:190px;max-width:210px;box-shadow:6px 0 8px -8px rgba(27,29,58,.35)}
  .tbl-wrap td:first-child b{font-size:12.5px;line-height:1.35}
  .tbl-wrap td{padding-top:9px;padding-bottom:9px;vertical-align:top}
  .tbl-wrap td:first-child{background:#fff}
  .tbl-wrap tr:nth-child(even) td:first-child{background:#FBFCFE}
  .tbl-wrap th:first-child{background:#F7F8FE}
  /* petunjuk bahwa tabel bisa digeser mendatar */
  .tbl-geser{font-size:11px;color:var(--faint);padding:2px 2px 8px;display:flex;gap:6px;align-items:center}
  .tbl-geser i{display:inline-block;width:14px;height:1.5px;background:var(--faint);position:relative}
  .tbl-geser i:after{content:'';position:absolute;right:-1px;top:-2.5px;border:3px solid transparent;border-left-color:var(--faint)}
  .tblbar{flex-direction:column}
  .tblbar input,.tblbar select{width:100%}
  .tblfoot{flex-direction:column;align-items:flex-start;gap:8px}
  /* papan kanban dan kalender */
  .board{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .board .col{min-width:186px;flex:0 0 186px}
  .calgrid{gap:3px}
  .cald{min-height:58px;padding:4px}
  .cald .dn{font-size:10px}
  .cald .ev{font-size:9px;padding:1px 3px}
  .dowhead{font-size:10px;gap:3px}
  /* modal penuh layar */
  .scrim{padding:0;align-items:flex-end;overflow:hidden}
  .modal,.modal.wide{max-width:100%;border-radius:14px 14px 0 0;max-height:92vh;overflow-y:auto}
  .mf{position:sticky;bottom:0;background:#fff;flex-wrap:wrap}
  .mf 
.btn{flex:1;text-align:center}
  /* surat dan kartu */
  .maillist{max-height:none}
  .rowline{flex-wrap:wrap;gap:4px}
  .kpi-num{font-size:24px}
}
@media(max-width:640px){
  .cald{min-height:52px}
  .cald .ev{display:inline-block;width:7px;height:7px;padding:0;margin:2px 3px 0 0;border-radius:50%;
    overflow:hidden;text-indent:-999px;white-space:nowrap;background:var(--em600)}
  .cald .ev.l{background:var(--red)}
  .cald .ev.b{background:var(--amber)}
  .cald .ev.d{background:var(--slate)}
  .cald .ev.lain{display:none}
}
@media(max-width:480px){
  .tb-title{max-width:44vw}
  .crumb{display:none}
  .main{padding:66px 10px 56px}
  .card-body{padding:12px}
  .card-head{flex-wrap:wrap;gap:8px}
  
.btn{padding:8px 12px}
  .lg-judul{font-size:34px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--em600);outline-offset:2px}

/* ---- tambahan modul Laporan Manajemen dan CRUD ---- */
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.fl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);margin:8px 0}
.fl input,.fl select,.fl textarea{font:inherit;font-weight:400;font-size:13.5px;color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;width:100%}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:2px solid var(--em50);border-color:var(--em600)}
.fieldset{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:12px 0;background:#FBFDFE}
.fieldset>b{font-size:12.5px;display:block;margin-bottom:6px}
.blok{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:10px 0;background:#fff}
.blok.locked{background:#FAFAFA;opacity:.72}
.blok-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.blok .chk{margin:6px 0}
.blok .chk.dim span{color:var(--faint)}
.lm-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:6px;
  background:var(--em50);color:var(--em900);margin-right:4px}
.muted{color:var(--faint)}
.perlabel{font-weight:700;font-size:13px;padding:0 6px}
.row-btn{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn.danger{background:#fff;color:#B42318;border-color:#F3C6C1}
.btn.danger:hover{background:#FEF3F2}
.filterbar{display:flex;gap:8px;margin-bottom:12px}
.filterbar input,.filterbar select{font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff}
.filterbar input{flex:1}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}

/* ---- topbar: notifikasi, profil, dan layar masuk ---- */
.iconbtn{position:relative;background:transparent;border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:9px;
  width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.1)}
.ndot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--red);
  color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--em900)}
.profbtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  color:#fff;border-radius:9px;padding:4px 9px 4px 5px;cursor:pointer;font:inherit;font-size:13px}
.profbtn:hover{background:rgba(255,255,255,.16)}
.profbtn .pav{width:24px;height:24px;border-radius:50%;background:var(--em500);color:#04222B;display:grid;place-items:center;font-weight:700;font-size:12px}
.profbtn .cv{opacity:.7;font-size:10px}
.pop{position:absolute;top:50px;right:14px;width:330px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:0 8px 30px rgba(6,42,51,.18);display:none;z-index:60;color:var(--ink)}
.pop.on{display:block}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line2)}
.pop-b{padding:6px}
.pop select{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:4px 0 8px;background:#fff}
.popitem{display:block;width:100%;text-align:left;background:transparent;border:0;font:inherit;font-size:13.5px;color:var(--ink);
  padding:9px 10px;border-radius:8px;cursor:pointer}
.popitem:hover{background:var(--em50)}
.popitem.danger{color:#B42318}
.popitem.danger:hover{background:#FEF3F2}
.popsep{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:8px 10px 2px}
.nrow{padding:9px 10px;border-radius:8px;cursor:pointer;border-left:3px solid transparent}
.nrow:hover{background:var(--em50)}
.nrow.unread{border-left-color:var(--em600);background:#F5FBFD}
.nr-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loginwrap{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:80;padding:20px;overflow:auto}
.loginbox{width:100%;max-width:460px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;box-shadow:var(--shadow)}
.loginbox h2{font-family:Montserrat,sans-serif;font-size:19px;margin:16px 0 4px}
.loginlist{display:flex;flex-direction:column;gap:4px}
.loginrow{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.loginrow:hover{background:var(--em50);border-color:var(--line)}
.loginrow>div:nth-child(2){flex:1}
.loginsep{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:12px 4px 4px;border-top:1px solid var(--line2);margin-top:8px}
.avatar.big{width:44px;height:44px;font-size:17px}
.proftop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
/* ---- pesan ---- */
.mailsplit{display:grid;grid-template-columns:330px 1fr;gap:14px;align-items:start}
.maillist{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:72vh;overflow-y:auto}
.mailrow{padding:11px 13px;border-bottom:1px solid var(--line2);cursor:pointer;border-left:3px solid transparent}
.mailrow:hover{background:#F9FCFD}
.mailrow.active{background:var(--em50);border-left-color:var(--em600)}
.mailrow.unread .mr-sub{font-weight:700}
.mr-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mr-sub{font-size:13.5px;margin:1px 0 2px}
.mr-foot{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.mailview{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.mailhead h3{font-family:Montserrat,sans-serif;font-size:17px;margin:0 0 8px}
.chips{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.chip{font-size:11.5px;background:var(--slate50);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.chip.luar{background:#FFFBEB;border-color:#F5E3B8;color:#8A5A08}
.msglist{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.msg{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#FBFDFE}
.msg.mine{background:var(--em50);border-color:var(--em100)}
.msg-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:5px}
.msg-b{font-size:13.5px;line-height:1.6}
.replybox{border-top:1px solid var(--line2);padding-top:10px}
@media(max-width:900px){.mailsplit{grid-template-columns:1fr}}

/* ---- halaman masuk ---- */
.landing{position:fixed;inset:0;z-index:80;display:grid;grid-template-columns:1.15fr .85fr;background:var(--bg);overflow:auto}
.lg-kiri{position:relative;background:var(--grad);color:#fff;padding:56px 54px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.lg-kiri::after{content:'';position:absolute;right:-160px;bottom:-160px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(32,167,201,.32),transparent 68%)}
.lg-eyebrow{position:relative;z-index:1;display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.62);margin-bottom:30px}
.dotk{width:7px;height:7px;border-radius:50%;background:var(--em500);box-shadow:0 0 0 4px rgba(32,167,201,.2)}
.lg-judul{position:relative;z-index:1;font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(40px,5.4vw,74px);
  line-height:.94;letter-spacing:-.02em;margin:0 0 22px}
.lg-tipis{font-weight:300;color:var(--gold500)}
.lg-teks{position:relative;z-index:1;color:rgba(255,255,255,.74);font-size:14.5px;line-height:1.65;max-width:30em;margin:0}
.lg-garis{position:relative;z-index:1;width:64px;height:3px;background:var(--em500);margin:30px 0 14px;border-radius:2px}
.lg-versi{position:relative;z-index:1;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.lg-kanan{display:grid;place-items:center;padding:40px 28px}
.lg-card{width:100%;max-width:400px}
.lg-tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.14em;color:var(--em700);margin-bottom:18px}
.lg-card h2{font-family:Montserrat,sans-serif;font-size:27px;letter-spacing:-.01em;margin:0 0 6px}
.lg-sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.6}
.lgf{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:16px}
.lgf input{display:block;width:100%;margin-top:7px;font:inherit;font-size:14.5px;letter-spacing:0;text-transform:none;
  color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.lgf input:focus{outline:none;border-color:var(--em600);box-shadow:0 0 0 3px var(--em50)}
.lg-err{display:none;color:#B42318;background:var(--red50);border:1px solid #F3C6C1;border-radius:9px;
  padding:9px 12px;font-size:13px;margin-bottom:14px}
.lg-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--em900);color:#fff;
  border:0;border-radius:10px;padding:14px;font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.1em;cursor:pointer}
.lg-btn:hover{background:var(--em800)}
.lg-btn span{transition:.15s}
.lg-btn:hover span{transform:translateX(4px)}
@media(max-width:900px){.landing{grid-template-columns:1fr}.lg-kiri{padding:40px 26px;min-height:44vh}}

/* ---- tabel: urut, saring, halaman ---- */
.tblbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tblbar .tblq{flex:1;min-width:180px}
.tblbar input,.tblbar select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;color:var(--ink)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:var(--em50)}
.sarrow{margin-left:5px;opacity:.32;font-size:10px}
.sarrow.on{opacity:1;color:var(--em700)}
.tblfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.tblfoot .pager{display:flex;align-items:center;gap:7px}
.tblfoot .pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}
.tblfoot .pager button:disabled{opacity:.4;cursor:default}
.cald.ada{cursor:pointer}
.cald.ada:hover{border-color:var(--em500);box-shadow:0 0 0 2px var(--em50)}
.cald .ev.lain{background:transparent;color:var(--faint)}

/* ---- lampiran ---- */
.lamp{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:12px 0;background:#FBFDFE}
.lamp-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.lamp-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line2)}
.lamp-row:first-of-type{border-top:0}
.lamp-ic{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:7px;background:var(--em50);color:var(--em800);font-size:13px}
.lamp-info{flex:1;min-width:0}
.lamp-info b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lamp-bar{height:6px;background:var(--line2);border-radius:99px;overflow:hidden;margin:8px 0}
.lamp-bar i{display:block;height:100%;background:var(--em600);width:2%;transition:width .2s}
.fl input[type=file]{padding:9px;background:#fff}

/* ---- laporan manajemen per keluaran ---- */
.outrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line2);cursor:pointer}
.outrow:first-of-type{border-top:0}
.outrow:hover{background:var(--em50)}
.outk b{font-size:13px}
.tbar{display:inline-flex;gap:3px}
.tstep{width:16px;height:5px;border-radius:3px;background:var(--line)}
.tstep.on{background:var(--em600)}
.tstep.warn{background:var(--amber)}
.col-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;margin-bottom:8px}
.col-h .cnt{margin-left:auto;color:var(--faint);font-weight:400}
.stepno{width:19px;height:19px;border-radius:6px;background:var(--em700);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:700}

/* ---- kotak lampiran bertab ---- */
.lamp-tabs{margin-bottom:12px}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;background:#FBFDFE;cursor:pointer;transition:.15s}
.dropzone:hover,.dropzone.over{border-color:var(--em500);background:var(--em50)}
.dropzone .dz-ic{font-size:26px;color:var(--em600);line-height:1;margin-bottom:8px}
.dropzone b{display:block;font-size:13.5px;margin-bottom:3px}
.dz-pick{color:var(--em700);font-weight:600;text-decoration:underline;cursor:pointer}
.doklist{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:11px}
.dokrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-top:1px solid var(--line2);cursor:pointer}
.dokrow:first-child{border-top:0}
.dokrow:hover{background:var(--em50)}
.outrow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line2);cursor:pointer}

/* ---- kerangka ponsel bergaya aplikasi ---- */
.btabs{display:none}
.hero-hp{display:none}
.qgrid{display:none}
@media(max-width:820px){
  .btabs{display:flex;gap:4px;position:fixed;left:10px;right:10px;bottom:10px;z-index:45;background:#fff;
    border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 8px 26px rgba(43,42,110,.16)}
  .btab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:10px;
    font-size:10.5px;color:var(--faint);position:relative;cursor:pointer}
  .btab .bi{font-size:17px;line-height:1}
  .btab.on{color:#fff;font-weight:700;background:var(--grad-btn);box-shadow:0 6px 14px rgba(91,91,214,.28)}
  .btab.on .bi{color:#fff}
  .btab .bdot{position:absolute;top:2px;right:22%;min-width:15px;height:15px;padding:0 4px;border-radius:9px;
    background:var(--red);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center}
  .main{padding-bottom:150px}
  /* kartu di luar layar tidak perlu ditata dan dicat, ini yang paling terasa saat berpindah halaman */
  .card,.tbl-wrap,.board{content-visibility:auto;contain-intrinsic-size:auto 320px}
  .card{box-shadow:0 1px 2px rgba(43,42,110,.05)}
  .node,.qi .ic,.mg .ic{box-shadow:none}
  /* kepala bergaya aplikasi */
  .hero-hp{display:block;margin:-70px -12px 16px;padding:66px 18px 22px;background:var(--grad);color:#fff;
    border-radius:0 0 30px 30px;position:relative;overflow:hidden;max-width:100vw}
  .hero-hp::after{content:'';position:absolute;right:-70px;top:-90px;width:250px;height:250px;border-radius:50%;
    background:rgba(255,255,255,.10)}
  .hero-hp::before{content:'';position:absolute;left:-90px;bottom:-120px;width:230px;height:230px;border-radius:50%;
    background:rgba(255,255,255,.07)}
  .hero-hp .hh{position:relative;z-index:1}
  .hero-hp .sapa{font-family:Montserrat,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.15}
  .hero-hp .sub{font-size:12.5px;color:rgba(255,255,255,.78);margin-top:6px;max-width:26em;line-height:1.5}
  .hero-hp .cari{display:flex;align-items:center;gap:9px;background:#fff;border-radius:999px;padding:11px 16px;margin-top:16px;
    box-shadow:0 6px 18px rgba(43,42,110,.18)}
  .hero-hp .cari span{color:var(--faint);font-size:14px}
  .hero-hp .cari input{flex:1;border:0;outline:none;font:inherit;font-size:13.5px;color:var(--ink);background:transparent;min-width:0}
  .hero-hp .hstat{display:flex;gap:9px;margin-top:16px}
  .hero-hp .hs{flex:1;min-width:0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);
    border-radius:16px;padding:9px 11px}
  .hero-hp .hs b{display:block;font-family:Montserrat,sans-serif;font-size:19px;font-weight:700}
  .hero-hp .hs span{font-size:10px;color:rgba(255,255,255,.76);letter-spacing:.04em}
  /* pintasan bulat seperti contoh */
  .qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:2px 0 18px}
  .qi{background:transparent;border:0;padding:4px 2px;text-align:center;position:relative}
  .qi .ic{width:54px;height:54px;margin:0 auto 7px;border-radius:50%;background:var(--grad-btn);color:#fff;
    display:grid;place-items:center;font-size:20px;box-shadow:0 6px 14px rgba(91,91,214,.28)}
  .qi.pucat .ic{background:var(--em100);color:var(--em700);box-shadow:none}
  .qi b{display:block;font-size:10.5px;font-weight:600;line-height:1.25;color:var(--muted)}
  .qi .bdot{position:absolute;top:0;right:14%;min-width:16px;height:16px;padding:0 4px;border-radius:9px;
    background:var(--red);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
  /* halaman Lainnya bergaya More */
  .mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
  .mg{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 8px;text-align:center;position:relative;box-shadow:var(--shadow)}
  .mg .ic{width:46px;height:46px;margin:0 auto 9px;border-radius:50%;background:var(--em100);color:var(--em700);
    display:grid;place-items:center;font-size:19px}
  .mg b{display:block;font-size:11.5px;font-weight:600;line-height:1.3;color:var(--em900)}
  .mg .bdot{position:absolute;top:8px;right:10px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;
    background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
  .mgjudul{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:4px 2px 8px}
  .sidebar{display:none}
  .burger{display:none}
  /* beranda ponsel berhenti sampai kalender agenda */
  .dash-lanjut,.dash-sisi{display:none}
  .hero-hp + .qgrid + .head-row .page-title,.hero-hp ~ .head-row .page-title{display:none}
  .hero-hp ~ .head-row{margin-bottom:0}
}

/* ---- pencarian ---- */
.cari-page{display:flex;align-items:center;gap:10px;background:var(--em50);border:1px solid var(--em100);border-radius:999px;padding:11px 16px}
.cari-page span{color:var(--em600);font-size:15px}
.cari-page input{flex:1;border:0;outline:none;background:transparent;font:inherit;font-size:14px;color:var(--ink);min-width:0}
.carirow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2);cursor:pointer}
.carirow:first-of-type{border-top:0}
.carirow:hover{background:var(--em50)}

/* ---- ikon SVG ---- */
.ikon{display:block;flex:none}
.ni .ic,.navitem .ic{display:flex;align-items:center;justify-content:center;width:20px;height:20px;color:var(--muted)}
.ni.active .ic,.navitem.active .ic{color:#fff}
.btab .bi{display:flex;align-items:center;justify-content:center;height:22px}
.qi .ic svg,.mg .ic svg{stroke-width:1.8}

/* ---- umpan balik ketukan supaya perpindahan halaman terasa langsung ---- */
.qi,.mg,.btab,.navitem,.ni{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.qi:active,.mg:active{transform:scale(.96);opacity:.9}
.btab:active{opacity:.7}
.qi,.mg{transition:transform .08s ease, opacity .08s ease}
.btab.sedang,.qi.sedang,.mg.sedang{opacity:.75}
/* garis tipis di bawah topbar saat halaman sedang disusun */
#memuat{position:fixed;left:0;top:56px;height:2px;width:0;background:var(--em500);z-index:60;
  transition:width .18s ease, opacity .2s ease;opacity:0;pointer-events:none}
body.memuat #memuat{width:70%;opacity:1}

/* ---- aksen keuangan ---- */
.kpi.uang .kpi-num{color:var(--hijau)}
.kpi.uang{border-left:3px solid var(--hijau)}
.num,.tblnum{font-variant-numeric:tabular-nums}
table td.num,table th.num{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tag.emas{background:var(--gold50);color:var(--gold);border:1px solid var(--goldline)}
.lg-garis{background:var(--gold500)}
.dotk{background:var(--gold500);box-shadow:0 0 0 4px rgba(201,162,39,.18)}
.brand .mark,.mark{background:var(--grad-btn)}
.rupiah{font-variant-numeric:tabular-nums;font-weight:600}
</style>
</head>
<body>
<div class="topbar">
  <button class="burger" id="burger" aria-label="Buka menu">&#9776;</button>
  <div>
    <div class="tb-title" id="tbTitle">Dashboard Saya</div>
    <div class="crumb" id="tbCrumb">SIMS</div>
  </div>

/* ============================================================
   SIMS — purwarupa antarmuka. Seluruh data disimpan di peramban.
   Aturan akses di berkas ini hanya penyaringan tampilan.
   Di produksi, penyaringan wajib ditegakkan di sisi server.

const TODAY = '2026-08-12';
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const DOW = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];

const D = s => new Date(s + 'T00:00:00');
const iso = d => d.toISOString().slice(0,10);
const addD = (s,n) => { const d = D(s); d.setDate(d.getDate()+n); return iso(d); };
const dow = s => D(s).getDay();
const isWk = s => dow(s)===0 || dow(s)===6;
const diff = (a,b) => Math.round((D(b)-D(a))/86400000);
const fmtD = s => s ? D(s).getDate()+' '+BLN[D(s).getMonth()]+' '+D(s).getFullYear() : '—';
const fmtDS = s => s ? D(s).getDate()+' '+BLN[D(s).getMonth()] : '—';
const fmtP = p => { const [y,m]=p.split('-'); return BULAN[+m-1]+' '+y; };
const fmtPS = p => { const [y,m]=p.split('-'); return BLN[+m-1]+' '+y.slice(2); };
const rp = n => 'Rp ' + (n||0).toLocaleString('id-ID');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '-' + Math.random().toString(36).slice(2,8);
const lastDay = p => { const [y,m]=p.split('-').map(Number); return iso(new Date(Date.UTC(y,m,0))); };
const prevP = p => { let [y,m]=p.split('-').map(Number); m--; if(m<1){m=12;y--;} return y+'-'+String(m).padStart(2,'0'); };
const nextP = p => { let [y,m]=p.split('-').map(Number); m++; if(m>12){m=1;y++;} return y+'-'+String(m).padStart(2,'0'); };
const pOf = s => s.slice(0,7);

/* --- kalender kerja: akhir pekan + hari libur yang bisa disunting --- */
function isHol(s){ return S.libur.some(h => h.tgl === s); }
function isOff(s){ return isWk(s) || isHol(s); }
function nextWork(s){ let x = s, n = 0; while(isOff(x) && n < 30){ x = addD(x,1); n++; } return x; }
function addWork(s,n){ let x = s, c = 0, g = 0; while(c < n && g < 200){ x = addD(x,1); g++; if(!isOff(x)) c++; } return x; }
function workLeft(from,to){ let c = 0, x = from; if(diff(from,to) < 0) return -workLeft(to,from); while(x < to){ x = addD(x,1); if(!isOff(x)) c++; } return c; }

/* ============================================================
   Jembatan ke Apps Script.
   Bagian ini menyatu di dalam berkas antarmuka supaya proyek
   Apps Script cukup berisi dua berkas, yaitu Code dan index.
   Saat dibuka langsung dari perangkat tanpa Apps Script,
   seluruh fungsi di sini diam dan dashboard tetap jalan.
   ============================================================ */
if(typeof google !== 'undefined' && google.script && google.script.run){
window.SIMS = (function () {
  var TOKEN_KUNCI = 'sims_token';
  var token = null;
  try { token = sessionStorage.getItem(TOKEN_KUNCI); } catch (e) {}
  var SNAP = {};                       // salinan terakhir dari peladen, dipakai untuk mencari perubahan
  var KOLEKSI = ['tim','klien','project','rekening','kewajiban','libur','akun','periode','patuh','produksi',
    'analisa','konfirm','laporan','review','dokreq','lm','dok','tugas','cuti','meeting','notulen','aksi',
    'pesan','notif','invoice','bayar','lead','konten','lampiran'];

  function panggil(fn, args) {
    return new Promise(function (res, rej) {
      google.script.run
        .withSuccessHandler(function (r) { r && r.ok ? res(r.data) : rej(new Error(r ? r.pesan : 'Tidak ada jawaban dari peladen.')); })
        .withFailureHandler(function (e) { rej(e); })
        [fn].apply(null, args);
    });
  }

  function petakan(arr) {
    var m = {};
    (arr || []).forEach(function (x) { if (x && x.id) m[x.id] = JSON.stringify(x); });
    return m;
  }

  function ambilSnapshot(S) {
    SNAP = {};
    KOLEKSI.forEach(function (k) { SNAP[k] = petakan(S[k]); });
  }

  return {
    adaToken: function () { return !!token; },

    masuk: function (surel, sandi) {
      return panggil('apiMasuk', [surel, sandi]).then(function (r) {
        token = r.token;
        try { sessionStorage.setItem(TOKEN_KUNCI, token); } catch (e) {}
        return r;
      });
    },

    keluar: function () {
      var t = token;
      token = null;
      try { sessionStorage.removeItem(TOKEN_KUNCI); } catch (e) {}
      return panggil('apiKeluar', [t]).catch(function () { return {ok: true}; });
    },

    gantiSandi: function (lama, baru) { return panggil('apiGantiSandi', [token, lama, baru]); },

    /** Mengambil seluruh keadaan yang boleh dilihat pengguna ini. Penyaringan terjadi di peladen. */
    muat: function () {
      return panggil('apiKeadaan', [token]).then(function (S) { ambilSnapshot(S); return S; });
    },

    /**
     * Mengirim perubahan. Membandingkan keadaan sekarang dengan salinan terakhir,
     * lalu hanya mengirim rekaman yang berubah dan yang hilang.
     */
    simpan: function (S) {
      var ubah = [], hapus = [];
      KOLEKSI.forEach(function (k) {
        var kini = petakan(S[k]), dulu = SNAP[k] || {};
        Object.keys(kini).forEach(function (id) {
          if (dulu[id] !== kini[id]) ubah.push({koleksi: k, rec: JSON.parse(kini[id])});
        });
        Object.keys(dulu).forEach(function (id) {
          if (!kini[id]) hapus.push({koleksi: k, id: id});
        });
      });
      if (!ubah.length && !hapus.length) return Promise.resolve({ok: true, jumlah: 0});
      var rantai = ubah.length ? panggil('apiSimpanBanyak', [token, ubah]) : Promise.resolve();
      return rantai.then(function () {
        return Promise.all(hapus.map(function (h) {
          return panggil('apiHapus', [token, h.koleksi, h.id, 'dihapus lewat antarmuka']);
        }));
      }).then(function () { ambilSnapshot(S); return {ok: true, jumlah: ubah.length + hapus.length}; });
    },

    catat: function (aksi, ref) { return panggil('apiCatatLog', [token, aksi, ref]); },

    /* ---- memindahkan data ke Spreadsheet ---- */
    semai: function (isi, mode) { return panggil('apiSemai', [token, isi, mode || 'ganti']); },
    isiLembar: function () { return panggil('apiIsiLembar', [token]); },
    setelan: function (kunci, nilai) { return panggil('apiSetelan', [token, kunci, nilai]); },

    /* ---- pengaturan sistem oleh Director ---- */
    simpanAturan: function (isi) { return panggil('apiSimpanAturan', [token, isi]); },
    simpanOtomasi: function (rec) { return panggil('apiSimpanOtomasi', [token, rec]); },
    buatPengguna: function (data) { return panggil('apiBuatPengguna', [token, data, data.sandi]); },
    statusAkun: function (id, aktif) { return panggil('apiStatusAkun', [token, id, aktif]); },
    resetSandi: function (id, sandi) { return panggil('apiResetSandi', [token, id, sandi]); },
    akunKlien: function (klien, login, sandi) { return panggil('apiAkunKlien', [token, klien, login, sandi]); },

    /* ---- Google Calendar ---- */
    rapatBuat: function (rec) { return panggil('apiRapatBuat', [token, rec]); },
    rapatBatal: function (eventId) { return panggil('apiRapatBatal', [token, eventId]); },
    kalendarImpor: function (dari, sampai) { return panggil('apiKalendarImpor', [token, dari, sampai]); },

    /** Melampirkan tautan pada satu rujukan, misalnya 'tugas:t-123'. */
    lampirTautan: function (ref, nama, url) { return panggil('apiLampirTautan', [token, ref, nama, url]); },
    hapusLampiran: function (id, alasan) { return panggil('apiHapusLampiran', [token, id, alasan]); },

    /**
     * Mengunggah berkas ke folder Drive Sage secara bertahap.
     * Berkas dipotong empat megabita per kiriman supaya tidak melampaui batas satu panggilan.
     */
    unggah: function (file, ref, onKemajuan) {
      var BATAS = 20 * 1024 * 1024;
      if (file.size > BATAS) return Promise.reject(new Error('Berkas melebihi batas 20 MB.'));
      var POTONG = 4 * 1024 * 1024, kunci = null, urut = 0;
      var total = Math.ceil(file.size / POTONG);

      function bacaPotongan(mulai) {
        return new Promise(function (res, rej) {
          var fr = new FileReader();
          fr.onload = function () { res(String(fr.result).split(',')[1]); };
          fr.onerror = function () { rej(new Error('Berkas gagal dibaca.')); };
          fr.readAsDataURL(file.slice(mulai, Math.min(mulai + POTONG, file.size)));
        });
      }
      function kirimBerikut(mulai) {
        if (mulai >= file.size) return panggil('apiUnggahSelesai', [token, kunci]);
        return bacaPotongan(mulai).then(function (b64) {
          return panggil('apiUnggahPotong', [token, kunci, urut++, b64]);
        }).then(function () {
          if (onKemajuan) onKemajuan(Math.round(urut / total * 96));
          return kirimBerikut(mulai + POTONG);
        });
      }
      return panggil('apiUnggahMulai', [token, ref, file.name, file.type, file.size])
        .then(function (r) { kunci = r.kunci; return kirimBerikut(0); })
        .then(function (rec) { if (onKemajuan) onKemajuan(100); return rec; });
    }
  };
})();
}

function nilaiUrut(t){

  if(d) return 400000 + new Date(Date.UTC(+d[3], BLNI[d[2].toLowerCase()] || 0, +d[1])).getTime() / 86400000;
  const n = t.replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(',','.');

    if(!c[0]) return;
    const nilai = [...new Set(rows.map(r => teksSel(r,i)).filter(v => v && v.length <= 26))];
    if(nilai.length >= 2 && nilai.length <= 8 && nilai.length < total) filKol.push([i, c[0], nilai.sort()]);
  });

  let baris = rows;
  if(st.q){
    const q = st.q.toLowerCase();
    baris = baris.filter(r => r.replace(/<[^>]*>/g,' ').toLowerCase().includes(q));
  }
  Object.keys(st.f).forEach(i => { if(st.f[i]) baris = baris.filter(r => teksSel(r, +i) === st.f[i]); });
  if(st.s >= 0){
    baris = baris.slice().sort((a,b) => {
      const ta = teksSel(a, st.s), tb = teksSel(b, st.s);
      const na = nilaiUrut(ta), nb = nilaiUrut(tb);
      const c = (na !== null && nb !== null) ? na - nb : ta.localeCompare(tb, 'id');
      return c * st.d;
    });
  }
  const hal = Math.max(1, Math.ceil(baris.length / barisTabel()));
  if(st.p > hal) st.p = hal;
  const mulai = (st.p - 1) * barisTabel();
  const tampil = baris.slice(mulai, mulai + barisTabel());

  const alat = (total >= 8 || filKol.length)
    ? '<div class="tblbar">' +
      '<input class="tblq" data-tblq="' + esc(k) + '" placeholder="Cari di tabel" value="' + esc(st.q) + '">' +
      filKol.map(([i,lab,nilai]) => '<select data-tblf="' + esc(k) + '" data-i="' + i + '">' +
        '<option value="">' + esc(lab) + ': semua</option>' +
        nilai.map(v => '<option' + (st.f[i] === v ? ' selected' : '') + '>' + esc(v) + '</option>').join('') + '</select>').join('') +
      (st.q || Object.values(st.f).some(Boolean) || st.s >= 0
        ? '<button class="btn sm ghost" data-act="tblReset" data-k="' + esc(k) + '">Atur ulang</button>' : '') +
      '</div>' : '';

  const kepala = '<tr>' + cols.map((c,i) => {
    const aktif = st.s === i;
    return '<th' + (c[1] ? ' style="' + c[1] + '"' : '') + (c[0] ? ' class="sortable" data-act="tblSort" data-k="' + esc(k) + '" data-i="' + i + '"' : '') + '>' +
      c[0] + (c[0] ? '<span class="sarrow' + (aktif ? ' on' : '') + '">' + (aktif ? (st.d > 0 ? '↑' : '↓') : '↕') + '</span>' : '') + '</th>';
  }).join('') + '</tr>';

  const pager = baris.length > barisTabel()
    ? '<div class="tblfoot"><span class="mini">' + (mulai + 1) + '–' + Math.min(mulai + barisTabel(), baris.length) + ' dari ' + baris.length +
      (baris.length !== total ? ' (disaring dari ' + total + ')' : '') + '</span><div class="pager">' +
      '<button data-act="tblHal" data-k="' + esc(k) + '" data-v="' + (st.p - 1) + '"' + (st.p === 1 ? ' disabled' : '') + '>&larr;</button>' +
      '<span class="mini">' + st.p + ' / ' + hal + '</span>' +
      '<button data-act="tblHal" data-k="' + esc(k) + '" data-v="' + (st.p + 1) + '"' + (st.p === hal ? ' disabled' : '') + '>&rarr;</button>' +
      '</div></div>'
    : (baris.length !== total ? '<div class="tblfoot"><span class="mini">' + baris.length + ' dari ' + total + ' baris</span></div>' : '');

  const isi = tampil.length ? tampil.join('')
    : '<tr><td colspan="' + cols.length + '"><div class="hint">Tidak ada baris yang cocok dengan penyaring.</div></td></tr>';
  const petunjuk = hp() && cols.length > 3
    ? '<div class="tbl-geser"><i></i>geser tabel ke samping untuk melihat kolom lain</div>' : '';
  return alat + petunjuk + '<div class="tbl-wrap"><table><thead>' + kepala + '</thead><tbody>' + isi + '</tbody></table></div>' + pager;
}

      '<div class="row-btn" style="margin:0 0 14px"><button class="btn" data-act="formTarget" data-v="' + S.periodeAktif + '">Tetapkan tenggat periode</button></div>';
  const bln = UI.sel.dashBln || TODAY.slice(0,7);
  const kartuAgenda = card('Agenda saya', kalender(bln, agendaSaya(bln)),
    '<div class="row-btn" style="margin:0"><button class="btn sm ghost" data-act="dashBln" data-v="-1">&larr;</button>' +
    '<span class="perlabel">' + fmtP(bln) + '</span>' +
    '<button class="btn sm ghost" data-act="dashBln" data-v="1">&rarr;</button></div>');

  h += '<div class="grid g23">' +
    '<div class="stack">' +
    card('Tugas saya', table([['Tugas'],['Tenggat'],['Sisa'],['Status'],['','width:1%']], rowsT, 'Tidak ada tugas terbuka'),
      '<button class="btn sm" data-act="formTugas">Tambah tugas</button>') +
    kartuAgenda + '</div>' +
    (hp() ? '<div style="display:none">' : '<div class="stack dash-sisi">') +
      card('Menunggu review saya', table([['Laporan'],['Sisa'],['','width:1%']], rowsR, 'Tidak ada antrean review')) +
      card('Perlu perhatian', (patuhDekat.length || lewatBatas.length ?
        patuhDekat.slice(0,5).map(x => '<div class="rowline"><div><b>' + esc(kwOf(x.kw).nama) + '</b><div class="mini">' + esc(klienOf(projOf(x.project).klien).nama) + ' · jatuh tempo ' + fmtD(x.jt) + '</div></div><div class="g">' + sisaPill(x.jt) + '</div></div>').join('') +
        lewatBatas.map(p => '<div class="rowline"><div><b>Laporan ' + esc(klienOf(projOf(p.project).klien).nama) + '</b><div class="mini">' + fmtP(p.periode) + ' · batas ' + fmtD(p.batasLaporan) + '</div></div><div class="g">' + sisaPill(p.batasLaporan) + '</div></div>').join('')
        : '<div class="hint">Tidak ada tenggat yang mendekat.</div>')) +
    '</div></div>';

  /* Di ponsel, beranda berhenti sampai kalender agenda. Sisanya tetap ada di
     layar lebar dan tetap dapat dibuka lewat menunya masing-masing. */
  if(hp()) return h;          /* di ponsel beranda berhenti sampai kalender agenda */
  h += '<div class="dash-lanjut">';

  if(isMgr()){
    const antre = S.produksi.filter(p => p.periode === S.periodeAktif && p.tahap < 8)
      .sort((a,b) => a.batasLaporan.localeCompare(b.batasLaporan));
    h += '<div style="height:14px"></div>' + card('Pekerjaan tim yang belum tuntas periode ini',
      table([['Klien'],['Tahap'],['PIC'],['Batas laporan'],['Sisa'],['','width:1%']],
        antre.map(p => '<tr><td><b>' + esc(klienOf(projOf(p.project).klien).nama) + '</b></td>' +
          '<td>' + statusPill(TAHAP[p.tahap-1]) + '</td><td>' + esc(nama(projOf(p.project).pic)) + '</td>' +
          '<td>' + fmtD(p.batasLaporan) + '</td><td>' + sisaPill(p.batasLaporan) + '</td>' +
          '<td class="num"><button class="btn sm ghost" data-act="openProd" data-id="' + p.id + '">Buka</button></td></tr>'),
        'Seluruh laporan periode ini sudah final'));
  }
  if(peran() === 'bizdev'){
    const leadSaya = S.lead.filter(l => l.pemilik === S.aktif && l.tahap < 5 && !l.konversi);
    const kontenSaya = S.konten.filter(k => k.pic === S.aktif && k.status !== 'Terbit');
    h += '<div style="height:14px"></div><div class="grid g2">' +
      card('Prospek yang saya pegang',
        table([['Prospek'],['Tahap'],['Tindakan berikutnya'],['','width:1%']],
          leadSaya.map(l => '<tr><td><b>' + esc(l.nama) + '</b><div class="mini">' + esc(l.bidang) + ' · ' + esc(l.jasa) + '</div></td>' +
            '<td>' + TAHAP_F[l.tahap-1] + '</td>' +
            '<td>' + (l.penawaranTgl && !l.followTgl ? 'follow up ' + fmtD(addD(l.penawaranTgl,7)) + ' ' + sisaPill(addD(l.penawaranTgl,7)) : '<span class="mini">jadwalkan langkah berikutnya</span>') + '</td>' +
            '<td class="num"><button class="btn sm ghost" data-act="openLead" data-id="' + l.id + '">Buka</button></td></tr>'),
          'Tidak ada prospek aktif'),
        '<button class="btn sm" data-act="formLead">Tambah prospek</button>') +
      card('Konten yang belum terbit',
        table([['Konten'],['Kanal'],['Tayang'],['Status']],
          kontenSaya.sort((a,b) => a.post.localeCompare(b.post)).map(k =>
            '<tr><td><b>' + esc(k.judul) + '</b><div class="mini">' + esc(k.pilar) + ' · ' + k.jenis + '</div></td>' +
            '<td>' + esc(k.kanal) + '</td><td>' + fmtD(k.post) + ' ' + sisaPill(k.post) + '</td>' +
            '<td>' + statusPill(k.status) + '</td></tr>'),
          'Tidak ada konten dalam antrean'),
        '<button class="btn sm" data-act="formKonten">Tambah konten</button>') +
      '</div>';
    return h + '</div>';
  }
  const lmSaya = (S.lm || []).filter(l => l.periode === S.periodeAktif && !l.kirim &&
    [l.preparer,l.taxPic,l.supAwal,l.supAkhir].includes(S.aktif));
  h += '<div style="height:14px"></div>' + card('Laporan Manajemen yang menunggu saya',
    table([['Klien'],['Tahap sekarang'],['Bagian saya'],['Batas kirim'],['','width:1%']],
      lmSaya.map(l => {
        const bag = [['preparer','Penyusun'],['taxPic','Pajak'],['supAwal','Review awal'],['supAkhir','Review akhir dan persetujuan']]
          .filter(([f]) => l[f] === S.aktif).map(([,lab]) => lab).join(', ');
        return '<tr><td><b>' + esc(klienOf(l.klien).nama) + '</b></td><td>' + statusPill(lmTahapUmum(l) === 'Terkirim ke klien' ? 'Final' : 'Sedang Dikerjakan') +
          ' <span class="mini">' + lmTahapUmum(l) + '</span></td><td>' + bag + '</td>' +
          '<td>' + fmtD(l.deliverBy) + ' ' + sisaPill(l.deliverBy, 0) + '</td>' +
          '<td class="num"><button class="btn sm ghost" data-act="openLM" data-id="' + l.id + '">Buka</button></td></tr>';
      }), 'Tidak ada berkas yang menunggu Anda'));
  h += '<div style="height:14px"></div>' + card('Klien yang saya pegang',
    myKlien().map(k => {
      const ps = myProjects().filter(p => p.klien === k.id);
      const pr = S.produksi.find(p => p.periode === S.periodeAktif && ps.some(x => x.id === p.project));
      return '<div class="rowline"><div><b>' + esc(k.nama) + '</b><div class="mini">' + ps.map(p => p.jenis).join(' · ') + (k.group !== '—' ? ' · ' + esc(k.group) : '') + '</div></div>' +
        '<div class="g">' + (pr ? '<span class="pill">tahap ' + pr.tahap + ' dari 8</span>' : '') + (k.prioritas === 'Tinggi' ? '<span class="pill ok">prioritas tinggi</span>' : '') + '</div></div>';
    }).join(''));
  return h + '</div>';
}

/* ================= Modul C — Papan Produksi ================= */
const TAHAP = ['Dokumen Diminta','Dokumen Diterima','Analisa Mutasi','Summary Rekening','Konfirmasi Saldo','Penyusunan Laporan','Review Berjenjang','Final'];

function pgProduksi(){
  const t = T('prod', [['papan','Papan produksi'],['review','Antrean review'],['tenggat','Pemantauan tenggat']]);
  let h = head('Modul C', 'Produksi Kerja Klien', 'Alur bulanan dari permintaan dokumen sampai laporan final yang sudah direview',
    '<div class="search"><input id="qProd" placeholder="Cari klien" value="' + esc(UI.q.prod || '') + '" data-act="qProd"></div>');
  h += tabs('prod', [['papan','Papan produksi'],['review','Antrean review'],['tenggat','Pemantauan tenggat']]);

  if(t === 'papan'){
    const my = myProjects().map(p => p.id);
    const semua = S.produksi.filter(p => p.periode === S.periodeAktif && my.includes(p.project));
    const fin = semua.filter(p => p.tahap === 8).length;
    const tel = semua.filter(p => p.tahap < 8 && diff(p.batasLaporan, TODAY) > 0).length;
    const rvAktif = S.review.filter(r => r.status === 'Sedang Direview' && semua.some(p => S.laporan.some(l => l.id === r.laporan && l.prod === p.id))).length;
    h += '<div class="grid g4" style="margin-bottom:14px">' +
      kpi('Project periode ini', semua.length, fmtP(S.periodeAktif)) +
      kpi('Laporan final', fin + ' dari ' + semua.length, Math.round(fin / (semua.length || 1) * 100) + ' persen') +
      kpi('Sedang direview', rvAktif, 'tahap review aktif') +
      kpi('Lewat batas laporan', tel, tel ? 'batas tujuh hari kerja terlewat' : 'seluruhnya dalam tenggat', tel > 0) + '</div>';
    let cards = S.produksi.filter(p => p.periode === S.periodeAktif && my.includes(p.project));
    if(UI.q.prod) cards = cards.filter(p => klienOf(projOf(p.project).klien).nama.toLowerCase().includes(UI.q.prod.toLowerCase()));
    cards.sort((a,b) => (klienOf(projOf(b.project).klien).prioritas === 'Tinggi') - (klienOf(projOf(a.project).klien).prioritas === 'Tinggi'));
    h += '<div class="board">' + TAHAP.map((nm,i) => {
      const list = cards.filter(c => c.tahap === i+1);
      return '<div class="col"><h4><span class="stepno">' + (i+1) + '</span>' + nm + '<span class="cnt">' + list.length + '</span></h4>' +
        list.map(c => tileProd(c)).join('') + (list.length ? '' : '<div class="mini" style="padding:14px 4px;text-align:center">kosong</div>') + '</div>';
    }).join('') + '</div>';
    h += '<div style="height:6px"></div>' + card('Ringkasan periode ' + fmtP(S.periodeAktif),
      table([['Klien'],['Tahap'],['PIC'],['Reviewer'],['Batas analisa'],['Batas laporan'],['Status laporan'],['','width:1%']],
        cards.sort((a,b) => a.tahap - b.tahap).map(c => { const rep = S.laporan.find(l => l.prod === c.id);
          return '<tr><td><b>' + esc(klienOf(projOf(c.project).klien).nama) + '</b>' +
            (klienOf(projOf(c.project).klien).prioritas === 'Tinggi' ? ' <span class="pill ok">prioritas</span>' : '') + '</td>' +
            '<td>' + c.tahap + ' · ' + TAHAP[c.tahap-1] + '</td><td>' + esc(nama(projOf(c.project).pic)) + '</td>' +
            '<td>' + esc(nama(projOf(c.project).reviewer)) + '</td><td>' + fmtD(c.batasAnalisa) + '</td>' +
            '<td>' + fmtD(c.batasLaporan) + ' ' + sisaPill(c.batasLaporan, c.tahap === 8) + '</td>' +
            '<td>' + (rep ? statusPill(rep.status) : '<span class="pill">belum disusun</span>') + '</td>' +
            '<td class="num"><button class="btn sm ghost" data-act="openProd" data-id="' + c.id + '">Buka</button></td></tr>'; })));
    const acuan = S.produksi.find(p => p.periode === S.periodeAktif);
    if(acuan) h += '<div class="note" style="margin-top:12px">Batas penyusunan laporan periode ini ' + fmtD(acuan.batasLaporan) +
      ', yaitu tujuh hari kerja dari awal bulan dengan hari libur yang terdaftar di Pengaturan sudah dikecualikan. Kartu dengan garis hijau adalah klien group berprioritas tinggi.</div>';
  }
  if(t === 'review'){
    const q = S.review.filter(r => r.status !== 'Menunggu' || S.review.some(x => x.laporan === r.laporan && x.tahap === r.tahap - 1 && x.status === 'Disetujui'));
    const mine = q.filter(r => r.status === 'Sedang Direview' && (isMgr() || r.reviewer === S.aktif));
    const rows = mine.sort((a,b) => a.batas.localeCompare(b.batas)).map(r => {
      const rep = S.laporan.find(l => l.id === r.laporan);
      return '<tr><td><b>' + esc(namaProj(rep.project)) + '</b><div class="mini">' + fmtP(rep.periode) + '</div></td>' +
        '<td>Tahap ' + r.tahap + '<div class="mini">' + esc(r.fokus) + '</div></td><td>' + esc(nama(r.reviewer)) + '</td>' +
        '<td>' + fmtD(r.batas) + '</td><td>' + sisaPill(r.batas) + '</td>' +
        '<td class="num"><button class="btn sm" data-act="openProd" data-id="' + rep.prod + '">Buka</button></td></tr>';
    });
    h += table([['Laporan'],['Tahap'],['Reviewer'],['Batas'],['Sisa'],['','width:1%']], rows, 'Antrean review kosong');
    h += '<div class="note warn" style="margin-top:12px">Empat tahap berurutan dalam batas dua hari berarti rata-rata dua belas jam per tahap. Keputusan Sage soal reviewer pengganti belum diambil, jadi purwarupa ini belum melompat otomatis saat reviewer berhalangan.</div>';
  }
  if(t === 'tenggat'){
    const my = myProjects().map(p => p.id);
    const items = [];
    S.produksi.filter(p => p.periode === S.periodeAktif && my.includes(p.project)).forEach(p => {
      if(p.tahap >= 3 && p.tahap < 6 && p.batasAnalisa) items.push({k:'Analisa mutasi', p, batas:p.batasAnalisa, pic:projOf(p.project).pic});
      if(p.tahap < 8) items.push({k:'Laporan bulanan', p, batas:p.batasLaporan, pic:projOf(p.project).pic});
    });
    S.review.filter(r => r.status === 'Sedang Direview').forEach(r => {
      const rep = S.laporan.find(l => l.id === r.laporan);
      if(my.includes(rep.project)) items.push({k:'Review tahap ' + r.tahap, p:{project:rep.project, periode:rep.periode, id:rep.prod}, batas:r.batas, pic:r.reviewer});
    });
    S.patuh.filter(x => my.includes(x.project) && !(x.billing && x.bayar && x.lapor)).forEach(x =>
      items.push({k:kwOf(x.kw).nama, p:{project:x.project, periode:x.periode, id:''}, batas:x.jt, pic:projOf(x.project).pic}));
    items.sort((a,b) => a.batas.localeCompare(b.batas));
    const rows = items.map(i => '<tr><td><b>' + esc(i.k) + '</b></td><td>' + esc(klienOf(projOf(i.p.project).klien).nama) + '</td>' +
      '<td>' + fmtPS(i.p.periode) + '</td><td>' + esc(nama(i.pic)) + '</td><td>' + fmtD(i.batas) + '</td><td>' + sisaPill(i.batas) + '</td>' +
      '<td class="num">' + (i.p.id ? '<button class="btn sm ghost" data-act="openProd" data-id="' + i.p.id + '">Buka</button>' : '') + '</td></tr>');
    h += table([['Pekerjaan'],['Klien'],['Periode'],['Penanggung jawab'],['Batas'],['Sisa'],['','width:1%']], rows, 'Tidak ada tenggat terbuka');
  }
  return h;
}
function tileProd(c){
  const k = klienOf(projOf(c.project).klien);
  const rep = S.laporan.find(l => l.prod === c.id);
  let batas = c.tahap <= 4 ? c.batasAnalisa : c.batasLaporan;
  if(c.tahap === 7 && rep){ const r = S.review.find(x => x.laporan === rep.id && x.status === 'Sedang Direview'); if(r) batas = r.batas; }
  const telat = c.tahap < 8 && batas && diff(batas, TODAY) > 0;
  return '<div class="tile ' + (telat ? 'od' : (k.prioritas === 'Tinggi' ? 'pri' : '')) + '" data-act="openProd" data-id="' + c.id + '">' +
    '<b>' + esc(k.nama) + '</b><div class="m">' + fmtP(c.periode) + ' · PIC ' + esc(nama(projOf(c.project).pic)) + '</div>' +
    '<div class="foot">' + (c.tahap === 8 ? '<span class="pill ok">final ' + fmtDS(rep ? rep.final : '') + '</span>' : sisaPill(batas)) +
    (k.prioritas === 'Tinggi' ? '<span class="pill ok">prioritas</span>' : '') + '</div></div>';
}
/* ---------- rincian kartu produksi ---------- */
function openProd(id){
  const c = S.produksi.find(p => p.id === id); if(!c) return;
  const p = projOf(c.project), k = klienOf(p.klien);
  const rep = S.laporan.find(l => l.prod === c.id);
  const an = S.analisa.filter(a => a.prod === c.id);
  const kf = S.konfirm.filter(x => x.prod === c.id);
  const rvs = rep ? S.review.filter(r => r.laporan === rep.id).sort((a,b) => a.tahap - b.tahap) : [];
  const dr = S.dokreq.find(d => d.project === c.project && d.periode === c.periode);

  let b = '<div class="hstack" style="margin-bottom:6px">' + statusPill(TAHAP[c.tahap-1]) +
    (k.prioritas === 'Tinggi' ? '<span class="pill ok">' + esc(k.group) + '</span>' : '') +
    '<span class="pill">PIC ' + esc(nama(p.pic)) + '</span><span class="pill">Reviewer ' + esc(nama(p.reviewer)) + '</span></div>';
  b += '<div class="stepbar">' + TAHAP.map((t,i) => '<div class="step ' + (i+1 < c.tahap ? 'done' : (i+1 === c.tahap ? 'now' : '')) + '" title="' + t + '"></div>').join('') + '</div>';
  b += '<div class="mini" style="margin-bottom:12px">Dokumen diterima ' + fmtD(c.diterima) + ' · batas analisa ' + fmtD(c.batasAnalisa) + ' · batas laporan ' + fmtD(c.batasLaporan) + '</div>';

  /* --- panel per tahap --- */
  if(c.tahap === 1){
    b += '';
    b += '<div class="stack"><div><label class="f">Jenis dokumen yang diminta</label>' +
      (dr ? dr.jenis.map(j => '<span class="pill" style="margin:2px 4px 2px 0">' + esc(j) + '</span>').join('') : '') + '</div>' +
      '<div><label class="f">Tanggal dokumen diterima</label><input class="i" type="date" id="fTerima" value="' + TODAY + '"></div></div>';
  }
  if(c.tahap === 2){
    b += '<div class="note">Dokumen sudah lengkap. Buat analisa mutasi untuk ' + an.length + ' rekening, batas ' + fmtD(c.batasAnalisa) + '.</div>' +
      rekTabel(an);
  }
  if(c.tahap === 3){ b += rekTabel(an) + '<div class="note warn" style="margin-top:10px">Kartu pindah ke Summary Rekening setelah seluruh rekening berstatus Selesai.</div>'; }
  if(c.tahap === 4){
    const tot = an.reduce((a,x) => ({m:a.m + x.masuk, k:a.k + x.keluar}), {m:0, k:0});
    b += '<div class="grid g3" style="margin-bottom:12px">' + kpi('Total uang masuk', rp(tot.m)) + kpi('Total uang keluar', rp(tot.k)) + kpi('Selisih', rp(tot.m - tot.k)) + '</div>';
    b += posTabel(an);
  }
  if(c.tahap === 5){
    b += '<div class="stack">' + kf.map(x => '<div class="rowline"><div><b>' + esc(x.item) + '</b><div class="mini">saldo akhir ' + rp(x.saldo) + (x.tglKonfirm ? ' · dikonfirmasi ' + fmtD(x.tglKonfirm) : '') + '</div></div>' +
      '<div class="g">' + statusPill(x.status) + (x.status !== 'Dikonfirmasi Klien' ?
        '<button class="btn sm ghost" data-act="konfirmNext" data-id="' + x.id + '" data-pid="' + c.id + '">' + (x.status === 'Diminta' ? 'Tandai diterima' : 'Tandai dikonfirmasi klien') + '</button>' : '') + '</div></div>').join('') + '</div>';
  }
  if(c.tahap === 6 && rep){
    b += '<div class="grid g2">' +
      '<div><label class="f">Tautan Laba Rugi</label><input class="i" id="fLr" value="' + esc(rep.lr) + '" placeholder="https://drive.google.com/..."></div>' +
      '<div><label class="f">Tautan Neraca</label><input class="i" id="fNr" value="' + esc(rep.nr) + '" placeholder="https://drive.google.com/..."></div>' +
      '<div><label class="f">Tautan Cashflow</label><input class="i" id="fCf" value="' + esc(rep.cf) + '" placeholder="https://drive.google.com/..."></div>' +
      '<div><label class="f">Tautan laporan manajemen (Januari sampai bulan berjalan)</label><input class="i" id="fMg" value="' + esc(rep.mgmt) + '" placeholder="https://drive.google.com/..."></div></div>' +
      '<div class="chk" style="margin-top:8px"><input type="checkbox" id="fRek" ' + (rep.rekon ? 'checked' : '') + '><label for="fRek">Angka hasil analisa Sage sudah dicocokkan dengan sistem keuangan klien untuk periode ini.</label></div>';
  }
  if(c.tahap >= 7 && rep){
    b += '<div class="stack">' + rvs.map(r => {
      const aktif = r.status === 'Sedang Direview';

function terimaDok(id){
  const c = S.produksi.find(p => p.id === id);
  const tgl = (document.getElementById('fTerima') || {}).value || TODAY;
  c.diterima = tgl; c.batasAnalisa = addWork(tgl, 4); c.tahap = 2;
  const dr = S.dokreq.find(d => d.project === c.project && d.periode === c.periode);
  if(dr){ dr.diterima = tgl; dr.status = 'Diterima Lengkap'; }
  const p = projOf(c.project);
  S.rekening.filter(r => r.klien === p.klien).forEach(r => {
    if(!S.analisa.some(a => a.prod === c.id && a.rek === r.id))
      S.analisa.push({id:uid('an'), prod:c.id, rek:r.id, periode:c.periode, batas:c.batasAnalisa, selesai:'', saldoAwal:0, saldoAkhir:0, masuk:0, keluar:0, kertas:'', status:'Belum Mulai', pic:p.pic, pos:[]});
    else { const a = S.analisa.find(a => a.prod === c.id && a.rek === r.id); a.batas = c.batasAnalisa; }
  });
  log('Dokumen ' + klienOf(p.klien).nama + ' periode ' + fmtP(c.periode) + ' dicatat diterima, tugas analisa dibuat dengan batas ' + fmtD(c.batasAnalisa), 'C.2');

}
function simpanAnalisa(id){
  const a = S.analisa.find(x => x.id === id);
  a.saldoAwal = +document.getElementById('aSa').value || 0;
  a.saldoAkhir = +document.getElementById('aSk').value || 0;
  a.masuk = +document.getElementById('aM').value || 0;
  a.keluar = +document.getElementById('aK').value || 0;
  a.kertas = document.getElementById('aKk').value.trim();
  a.pos = [...document.querySelectorAll('.pos-row')].map(r => ({akun:r.querySelector('.pos-akun').value, arah:r.querySelector('.pos-arah').value, nominal:+r.querySelector('.pos-nom').value || 0})).filter(x => x.nominal);
  if(!a.kertas){ toast('Tautan kertas kerja wajib diisi sebelum ditandai selesai.'); return; }
  a.status = 'Selesai'; a.selesai = TODAY;
  const c = S.produksi.find(p => p.id === a.prod);
  const semua = S.analisa.filter(x => x.prod === c.id);
  if(c.tahap < 3) c.tahap = 3;
  if(semua.every(x => x.status !== 'Belum Mulai' && x.status !== 'Sedang Dikerjakan')) c.tahap = Math.max(c.tahap, 4);
  log('Analisa mutasi rekening ' + (S.rekening.find(r => r.id === a.rek) || {}).bank + ' ' + klienOf(projOf(c.project).klien).nama + ' ' + fmtP(c.periode) + ' ditandai selesai', 'C.3');

}

function hitungJT(w, per){
  const raw = w.akhirBulan ? lastDay(per) : per + '-' + String(w.hari).padStart(2,'0');
  return {raw, jt: w.geser ? nextWork(raw) : raw};
}
function statusPatuh(x){
  const w = kwOf(x.kw);
  const n = (x.billing ? 1 : 0) + (x.bayar ? 1 : 0) + (x.lapor ? 1 : 0);
  const perlu = w.perluSetor ? 3 : 2;
  const tuntas = w.perluSetor ? (x.billing && x.bayar && x.lapor) : (x.billing && x.lapor);
  if(tuntas) return {c:2, t:'tuntas', n, perlu};
  if(diff(x.jt, TODAY) > 0) return {c:3, t:'telat', n, perlu};
  if(n > 0) return {c:1, t:n + '/' + perlu, n, perlu};
  return {c:0, t:'belum', n, perlu};
}

function kalender(per, evs){

  const my = myProjects().map(p => p.id);

    .forEach(t => tambah(t.tenggat, {t:'Tugas · ' + t.judul, c:'b', d: t.klien ? klienOf(t.klien).nama : 'internal', p:'tugas',

  S.meeting.filter(m => (m.peserta || []).includes(S.aktif) && m.status !== 'Dibatalkan')
    .forEach(m => tambah(m.tgl, {t:'Rapat ' + m.jam + ' · ' + (m.klien ? klienOf(m.klien).nama : m.jenis), c:'d',

        '<div class="g"><span class="pill">' + esc(nama(m.oleh)) + '</span></div></div>').join('') +
      '<button class="btn sm ghost" data-act="formMasukan" data-id="' + s.id + '" style="margin-top:10px">Tambah masukan</button>')).join('');
    const dl = S.laporan.filter(l => l.periode === S.periodeAktif && l.status === 'Final').length;
    h += '<div style="height:14px"></div>' + card('Agenda otomatis minggu keempat',

}

  if(t === 'ringkas'){
    h += '<div class="grid g2">' +
      card('Nilai kontrak bulanan per klien', S.klien.map(k => {
        const n = S.project.filter(p => p.klien === k.id).reduce((a,p) => a + p.nilai, 0);
        return '<div class="rowline"><div><b>' + esc(k.nama) + '</b></div><div class="g mono">' + rp(n) + '</div></div>'; }).join('')) +
      card('Invoice yang perlu ditindak', (belum.length ? belum.map(i => '<div class="rowline"><div><b>' + esc(i.no) + '</b><div class="mini">' + esc(klienOf(i.klien).nama) + ' · jatuh tempo ' + fmtD(i.jt) + '</div></div>' +
        '<div class="g">' + sisaPill(i.jt) + '<button class="btn sm ghost" data-act="bayarInv" data-id="' + i.id + '">Catat pembayaran</button></div></div>').join('') : '<div class="hint">Semua invoice sudah lunas.</div>')) + '</div>';
  }
  if(t === 'daftar'){
    h += table([['Nomor'],['Klien'],['Periode'],['Terbit'],['Jatuh tempo'],['Total','text-align:right'],['Status'],['','width:1%']],
      inv.sort((a,b) => b.terbit.localeCompare(a.terbit)).map(i => '<tr><td><b>' + esc(i.no) + '</b></td><td>' + esc(klienOf(i.klien).nama) + '</td>' +
        '<td>' + fmtPS(i.periode) + '</td><td>' + fmtD(i.terbit) + '</td><td>' + fmtD(i.jt) + '</td><td class="num">' + rp(i.total) + '</td>' +
        '<td>' + statusPill(diff(i.jt, TODAY) > 0 && i.status !== 'Lunas' ? 'Lewat Jatuh Tempo' : i.status) + '</td>' +
        '<td class="num">' + (i.status === 'Draft' ? '<button class="btn sm" data-act="kirimInv" data-id="' + i.id + '">Periksa dan kirim</button>' :
          (i.status !== 'Lunas' ? '<button class="btn sm ghost" data-act="bayarInv" data-id="' + i.id + '">Catat bayar</button>' : '')) + '</td></tr>'));
  }
  if(t === 'umur'){
    const bucket = [[0,14,'0 sampai 14 hari'],[15,30,'15 sampai 30 hari'],[31,60,'31 sampai 60 hari'],[61,9999,'lebih dari 60 hari']];
    h += table([['Umur'],['Jumlah invoice','text-align:right'],['Nilai','text-align:right'],['Klien']],

        return '<tr><td><b>' + b[2] + '</b></td><td class="num">' + g.length + '</td><td class="num">' + rp(g.reduce((a,x) => a + x.total, 0)) + '</td>' +
          '<td class="mini">' + (g.map(i => esc(klienOf(i.klien).nama)).join(', ') || '—') + '</td></tr>'; }));
    h += '';

function buatDraft(){
  const per = TODAY.slice(0,7);
  let n = 0;
  S.klien.filter(k => k.status === 'Aktif').forEach(k => {
    if(S.invoice.some(i => i.klien === k.id && i.periode === per)) return;
    const nilai = S.project.filter(p => p.klien === k.id).reduce((a,p) => a + p.nilai, 0), ppn = Math.round(nilai * 0.11);
    S.invoice.push({id:uid('inv'), no:'SAGE/' + String(50 + S.invoice.length).padStart(3,'0') + '/2026', klien:k.id, periode:per,
      nilai, ppn, total:nilai + ppn, terbit:per + '-24', kirim:'', jt:addD(per + '-24', 14), status:'Draft', berkas:'#'});
    n++;
  });
  log(n + ' draft invoice periode ' + fmtP(per) + ' dibuat, menunggu pemeriksaan Director', 'E');
  toast(n ? n + ' draft invoice dibuat. Draft tidak terkirim otomatis.' : 'Draft periode ini sudah ada.');
  save(); render();
}

  b += '<div class="rowline"><div><b>5 · Keputusan</b><div class="mini">' + (l.deal === 1 ? 'Deal' : (l.deal === 0 ? 'Tidak deal · ' + esc(l.alasan) : 'belum diputuskan')) + '</div></div>' +

        '<div class="chk"><input type="checkbox" ' + (d[f] ? 'checked' : '') + ' data-act="leadDoc" data-id="' + id + '" data-d="' + kk + '" data-f="' + f + '"><label>' + lab + '</label></div>').join('') + '</div>'; }).join('') + '</div>';

function pgSdm(){

    if(!m) return '—';                       /* tanggal masuk boleh kosong saat data baru ditarik */

  if(t === 'karyawan'){
    h += table([['Nama'],['Jabatan'],['Masuk'],['Masa kerja'],['Kontrak'],['Sisa cuti','text-align:right'],['Status']],
      S.tim.map(x => { const pakai = S.cuti.filter(c => c.tim === x.id && c.status === 'Disetujui' && c.jenis === 'Cuti tahunan')
          .reduce((a,c) => a + diff(c.mulai, c.selesai) + 1, 0);
        return '<tr><td><b>' + esc(x.nama) + '</b><div class="mini">' + esc(x.email) + '</div></td><td>' + esc(x.jabatan) + '</td>' +
          '<td>' + fmtD(x.masuk) + '</td><td>' + masaKerja(x.masuk) + '</td>' +
          '<td>' + esc(x.kontrak) + (x.kontrakAkhir ? '<div class="mini">sampai ' + fmtD(x.kontrakAkhir) + '</div>' : '') + '</td>' +
          '<td class="num">' + (x.cutiJatah - pakai) + ' dari ' + x.cutiJatah + '</td>' +
          '<td>' + (x.aktif ? '<span class="pill ok">aktif</span>' : '<span class="pill">nonaktif</span>') + '</td></tr>'; }));
  }
  if(t === 'kontrak'){
    const list = S.tim.filter(x => x.kontrakAkhir && diff(TODAY, x.kontrakAkhir) <= 90 && diff(TODAY, x.kontrakAkhir) >= 0);
    h += table([['Nama'],['Jabatan'],['Kontrak berakhir'],['Sisa'],['Peringatan 60 hari']],
      list.map(x => '<tr><td><b>' + esc(x.nama) + '</b></td><td>' + esc(x.jabatan) + '</td><td>' + fmtD(x.kontrakAkhir) + '</td>' +
        '<td>' + sisaPill(x.kontrakAkhir) + '</td><td>' + (diff(TODAY, x.kontrakAkhir) <= 60 ? '<span class="pill late">sudah dikirim ke Director</span>' : '<span class="pill">belum saatnya</span>') + '</td></tr>'),
      'Tidak ada kontrak yang berakhir dalam 90 hari');
  }
  if(t === 'gaji'){
    const bulan = ['2026-06','2026-07','2026-08'];
    h += table([['Karyawan']].concat(bulan.map(b => [fmtPS(b)])),
      S.tim.map(x => '<tr><td><b>' + esc(x.nama) + '</b></td>' + bulan.map(b => {
        const g = S.gaji.find(y => y.tim === x.id && y.bulan === b);
        return '<td>' + (g && g.status === 'Dibayar' ? '<span class="pill ok">dibayar ' + fmtDS(g.tgl) + '</span>' :
          '<button class="btn sm ghost" data-act="gajiBayar" data-id="' + (g ? g.id : '') + '">Tandai dibayar</button>') + '</td>'; }).join('') + '</tr>'));
    h += '';
  }
  if(t === 'masukan'){
    h += table([['Karyawan'],['Periode'],['Sudah baik'],['Dapat diperbaiki'],['Penilai']],
      S.sesiReview.flatMap(s => s.masukan.map(m => '<tr><td><b>' + esc(m.target) + '</b></td><td>' + fmtP(s.bulan) + '</td>' +
        '<td class="mini">' + esc(m.baik) + '</td><td class="mini">' + esc(m.perbaiki) + '</td><td>' + esc(nama(m.oleh)) + '</td></tr>')));
  }
  return h;
}
